<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 640" width="100%" height="100%">
  <defs>
    <filter id="lazy-shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="6" dy="8" stdDeviation="0" flood-color="#2B2B2B" flood-opacity="1" />
    </filter>
  </defs>

  <!-- Main Card Container -->
  <g filter="url(#lazy-shadow)">
    <rect x="10" y="10" width="550" height="610" rx="28" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="4.5"/>
  </g>

  <!-- Header Badge -->
  <g transform="translate(130, -4)">
    <rect x="0" y="0" width="310" height="48" rx="24" fill="#2B2B2B"/>
    <text x="155" y="31" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="20" fill="#F5C518" text-anchor="middle" letter-spacing="0.5">
      👅 게으른 혀의 소리 지름길
    </text>
  </g>

  <!-- Subtitle -->
  <text x="285" y="90" font-family="'Noto Sans KR', sans-serif" font-weight="800" font-size="21" fill="#2B2B2B" text-anchor="middle">
    "왜 하나만 말하고 하나는 쉴까?"
  </text>

  <!-- ================= TOP CARD: ❌ 힘든 방식 (모음 2개 다 발음) ================= -->
  <g transform="translate(35, 114)">
    <rect x="0" y="0" width="500" height="215" rx="18" fill="#FFF5F5" stroke="#FA5252" stroke-width="3"/>
    
    <!-- Status Tag -->
    <rect x="20" y="16" width="145" height="34" rx="10" fill="#E03131"/>
    <text x="92" y="39" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle">
      ❌ 피곤한 길
    </text>
    <text x="178" y="39" font-family="'Noto Sans KR', sans-serif" font-weight="800" font-size="17" fill="#C92A2A">
      모음 2개를 다 읽으려 하면?
    </text>

    <!-- Visual Scene: Exhausted Tongue Character facing Hurdles -->
    <!-- Hurdle 1 -->
    <g transform="translate(195, 78)">
      <rect x="0" y="25" width="45" height="65" rx="6" fill="#FFE3E3" stroke="#FA5252" stroke-width="2.5"/>
      <text x="22" y="52" font-family="'Archivo Black', sans-serif" font-size="20" fill="#E03131" text-anchor="middle">O</text>
      <text x="22" y="76" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="12" fill="#E03131" text-anchor="middle">1차</text>
    </g>
    <!-- Hurdle 2 -->
    <g transform="translate(255, 78)">
      <rect x="0" y="25" width="45" height="65" rx="6" fill="#FFE3E3" stroke="#FA5252" stroke-width="2.5"/>
      <text x="22" y="52" font-family="'Archivo Black', sans-serif" font-size="20" fill="#E03131" text-anchor="middle">A</text>
      <text x="22" y="76" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="12" fill="#E03131" text-anchor="middle">2차</text>
    </g>

    <!-- Exhausted Tongue Character -->
    <g transform="translate(45, 65)">
      <!-- Tongue body (sweating, exhausted) -->
      <path d="M 25 75 C 10 75 10 35 35 25 C 60 15 90 25 95 55 C 98 75 80 85 55 85 Z" fill="#FF8787" stroke="#2B2B2B" stroke-width="3"/>
      <!-- Tongue middle groove -->
      <path d="M 50 35 Q 52 55 48 70" fill="none" stroke="#E03131" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Dizzy X Eyes -->
      <path d="M 32 40 L 40 48 M 40 40 L 32 48" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 56 36 L 64 44 M 64 36 L 56 44" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Panting mouth with sweat -->
      <ellipse cx="48" cy="60" rx="8" ry="5" fill="#C92A2A"/>
      <!-- Sweat drops -->
      <path d="M 85 28 Q 92 38 85 45 Q 78 38 85 28 Z" fill="#4DABF7" stroke="#2B2B2B" stroke-width="1.5"/>
      <path d="M 98 42 Q 103 50 98 55 Q 93 50 98 42 Z" fill="#4DABF7" stroke="#2B2B2B" stroke-width="1.5"/>
    </g>

    <!-- Tangled road arrow -->
    <path d="M 160 145 Q 210 110 230 160 T 310 120 L 325 130" fill="none" stroke="#FA5252" stroke-width="3.5" stroke-dasharray="6,4" stroke-linecap="round"/>

    <!-- Bottom Result Pill -->
    <rect x="325" y="85" width="155" height="75" rx="12" fill="#FFFFFF" stroke="#FA5252" stroke-width="2"/>
    <text x="402" y="115" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="15" fill="#E03131" text-anchor="middle">
      혀가 2번 꺾임! 🥵
    </text>
    <text x="402" y="140" font-family="'Noto Sans KR', sans-serif" font-weight="700" font-size="13" fill="#868E96" text-anchor="middle">
      말하기 지치고 꼬임
    </text>
  </g>

  <!-- ================= BOTTOM CARD: ⭕ 지름길 (앞 모음만 발음) ================= -->
  <g transform="translate(35, 348)">
    <rect x="0" y="0" width="500" height="235" rx="18" fill="#E6FCF5" stroke="#099268" stroke-width="3"/>
    
    <!-- Status Tag -->
    <rect x="20" y="16" width="145" height="34" rx="10" fill="#099268"/>
    <text x="92" y="39" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle">
      ⭕ 소리 지름길
    </text>
    <text x="178" y="39" font-family="'Noto Sans KR', sans-serif" font-weight="800" font-size="17" fill="#087F5B">
      앞 모음 1개만 외치면?
    </text>

    <!-- Visual Scene: Chill Relaxed Tongue with Sunglasses & Cushion -->
    <g transform="translate(40, 70)">
      <!-- Comfy Pillow / Lounge Cushion -->
      <rect x="0" y="62" width="115" height="38" rx="14" fill="#FFE066" stroke="#2B2B2B" stroke-width="2.5"/>
      <ellipse cx="25" cy="62" rx="20" ry="12" fill="#FFD43B" stroke="#2B2B2B" stroke-width="2"/>

      <!-- Relaxed Tongue Character lying back -->
      <path d="M 25 65 C 20 40 45 28 75 32 C 100 36 108 55 95 72 C 85 82 45 82 25 65 Z" fill="#FFA8A8" stroke="#2B2B2B" stroke-width="3"/>
      <!-- Tongue groove -->
      <path d="M 55 42 Q 68 50 78 62" fill="none" stroke="#FA5252" stroke-width="2" stroke-linecap="round"/>

      <!-- Cool Sunglasses 😎 -->
      <rect x="52" y="38" width="18" height="12" rx="3" fill="#2B2B2B"/>
      <rect x="74" y="38" width="18" height="12" rx="3" fill="#2B2B2B"/>
      <path d="M 70 42 L 74 42" stroke="#2B2B2B" stroke-width="3"/>
      <!-- Smile -->
      <path d="M 68 58 Q 78 66 86 58" fill="none" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Sparkles -->
      <text x="10" y="38" font-size="16">✨</text>
      <text x="102" y="42" font-size="14">🌴</text>
    </g>

    <!-- Direct Golden Shortcut Path -->
    <g transform="translate(175, 78)">
      <!-- Straight smooth highway -->
      <rect x="0" y="24" width="145" height="42" rx="12" fill="#FFF9DB" stroke="#FAB005" stroke-width="2.5"/>
      <text x="72" y="51" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="16" fill="#F59F00" text-anchor="middle">
        초고속 직진 ➔
      </text>
      <!-- Big Golden Arrow -->
      <path d="M 10 45 L 132 45 M 120 37 L 135 45 L 120 53" fill="none" stroke="#F59F00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Sleeping Vowel Brother (A) sleeping peacefully on side -->
    <g transform="translate(335, 75)">
      <rect x="0" y="0" width="145" height="88" rx="14" fill="#FFFFFF" stroke="#099268" stroke-width="2.5"/>
      <circle cx="38" cy="44" r="24" fill="#E7F5FF" stroke="#2B2B2B" stroke-width="2"/>
      <text x="38" y="52" font-family="'Archivo Black', sans-serif" font-size="20" fill="#2B2B2B" text-anchor="middle">A</text>
      <text x="68" y="36" font-family="'Gaegu', cursive" font-weight="700" font-size="20" fill="#339AF0">Zzz</text>
      <text x="92" y="58" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="13" fill="#099268" text-anchor="middle">
        꿀잠 휴식 💤
      </text>
    </g>

    <!-- Bottom Takeaway inside card -->
    <rect x="20" y="176" width="460" height="44" rx="10" fill="#FFFFFF" stroke="#20C997" stroke-width="2"/>
    <text x="230" y="204" font-family="'Noto Sans KR', sans-serif" font-weight="800" font-size="15" fill="#087F5B" text-anchor="middle">
      ✨ 혀 힘 빼고 1번만 말하면 끝! 가장 자연스러운 발음법
    </text>
  </g>

  <!-- Bottom Core Takeaway Footer -->
  <g transform="translate(35, 592)">
    <text x="250" y="18" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="14" fill="#5C564A" text-anchor="middle">
      💡 발음 원리를 이해하면 외울 필요 없이 저절로 입이 열립니다.
    </text>
  </g>
</svg>
