<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Filters for High CTR Pop -->
    <filter id="heavy-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    
    <filter id="text-stroke-bg">
      <feMorphology operator="dilate" radius="8" in="SourceAlpha" result="thicken" />
      <feFlood flood-color="#0b071a" result="color" />
      <feComposite in="color" in2="thicken" operator="in" result="stroke" />
      <feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
      <feMerge>
        <feMergeNode in="stroke" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background & Highlight Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="40%" stop-color="#150d33"/>
      <stop offset="100%" stop-color="#2a0826"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231942" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f0a21" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="yellow-text-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF500"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844"/>
      <stop offset="100%" stop-color="#FF4E50"/>
    </linearGradient>

    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#1DE9B6"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E52E71"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>

    <linearGradient id="warm-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4E50" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#F9D423" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. MAIN BACKGROUND -->
  <rect width="1280" height="720" fill="url(#bg-grad)"/>

  <!-- Background Lighting Effects & Visual Atmosphere -->
  <circle cx="200" cy="150" r="300" fill="#7928CA" opacity="0.25" filter="blur(60px)"/>
  <circle cx="1100" cy="550" r="350" fill="#FF0080" opacity="0.2" filter="blur(80px)"/>
  <circle cx="640" cy="360" r="400" fill="#00F2FE" opacity="0.08" filter="blur(90px)"/>
  <rect width="1280" height="720" fill="url(#warm-light)"/>

  <!-- Subtle Grid Pattern for Modern Graphic Feel -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1280" height="720" fill="url(#grid)"/>
  </g>

  <!-- 2. LEFT SIDE: DRAMATIC EMOTIONAL SCENE (SITUATION CARD) -->
  <g transform="translate(60, 110)" filter="url(#heavy-shadow)">
    <!-- Main Framing Card -->
    <rect width="460" height="560" rx="32" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    
    <!-- Sunset/Twilight Sky Inside Card Scene -->
    <rect x="15" y="15" width="430" height="530" rx="24" fill="#0d1124"/>
    <path d="M 15 250 C 120 200, 320 220, 445 160 L 445 545 L 15 545 Z" fill="url(#pink-grad)" opacity="0.2"/>
    
    <!-- Stars / Glow Dots in Sky -->
    <circle cx="80" cy="70" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="200" cy="100" r="3" fill="#fff" opacity="0.5"/>
    <circle cx="360" cy="60" r="1.5" fill="#fff" opacity="0.9"/>
    <circle cx="310" cy="140" r="2.5" fill="#FFD166" opacity="0.7"/>

    <!-- Emotional Silhouette Scene (Person looking at phone, longing) -->
    <path d="M 120 545 C 120 450, 160 400, 210 390 C 200 370, 195 340, 205 310 C 220 270, 270 270, 280 310 C 290 340, 285 370, 275 390 C 325 400, 365 450, 365 545 Z" fill="#080413"/>
    
    <!-- Smartphone Glow & Light Projection -->
    <path d="M 220 410 L 265 400 L 280 445 L 230 455 Z" fill="#4FACFE" filter="url(#glow-cyan)"/>
    <polygon points="245,410 120,220 360,220" fill="url(#cyan-grad)" opacity="0.15"/>

    <!-- Thought / Dialogue Bubble: "보고 싶어요..." -->
    <g transform="translate(60, 60)" filter="url(#heavy-shadow)">
      <path d="M 20 0 L 280 0 C 291 0 300 9 300 20 L 300 90 C 300 101 291 110 280 110 L 120 110 L 80 140 L 90 110 L 20 110 C 9 110 0 101 0 90 L 0 20 C 0 9 9 0 20 0 Z" fill="#FFFFFF"/>
      <text x="150" y="52" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="900" font-size="32" fill="#111" text-anchor="middle">"보고 싶어요..."</text>
      <text x="150" y="88" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="700" font-size="22" fill="#FF0844" text-anchor="middle">애틋한 이 마음, 영어로는?</text>
    </g>

    <!-- Dilemma / Confusion Overlay Boxes -->
    <!-- Direct Translation Mistake -->
    <g transform="translate(30, 250)" filter="url(#heavy-shadow)">
      <rect width="400" height="85" rx="18" fill="#1c1326" stroke="#FF4E50" stroke-width="3"/>
      <text x="30" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FF4E50">직역 (❌ 틀리기 쉬운 표현)</text>
      <text x="30" y="68" font-family="Arial, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF">I want to see you <tspan fill="#FF4E50">(어색함!)</tspan></text>
      <circle cx="360" cy="42" r="22" fill="#FF4E50"/>
      <text x="360" y="51" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#FFF" text-anchor="middle">✕</text>
    </g>

    <!-- Real Expressive English Solution -->
    <g transform="translate(30, 360)" filter="url(#heavy-shadow)">
      <rect width="400" height="95" rx="18" fill="#0c281e" stroke="#00E676" stroke-width="4"/>
      <text x="30" y="38" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="900" font-size="22" fill="#00E676">원어민 리얼 표현 (⭕ 네이티브)</text>
      <text x="30" y="73" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#00F2FE">I miss you! ❤️</text>
      <circle cx="360" cy="48" r="24" fill="#00E676" filter="url(#glow-cyan)"/>
      <text x="360" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="30" fill="#000" text-anchor="middle">✓</text>
    </g>
    
    <!-- Heart Emoticons Floating -->
    <text x="390" y="160" font-size="35" opacity="0.8" filter="url(#glow-orange)">💖</text>
    <text x="40" y="210" font-size="28" opacity="0.6">💬</text>
  </g>

  <!-- 3. RIGHT SIDE: HIGH CTR TYPOGRAPHY & BRANDING -->
  
  <!-- EPISODE BADGE (Top Right) -->
  <g transform="translate(560, 65)" filter="url(#heavy-shadow)">
    <rect width="390" height="52" rx="26" fill="url(#badge-grad)"/>
    <text x="195" y="35" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      🔥 초급 필수 문장 20개 [EP.02]
    </text>
  </g>

  <g transform="translate(965, 65)" filter="url(#heavy-shadow)">
    <rect width="255" height="52" rx="26" fill="#19102e" stroke="#FFD166" stroke-width="3"/>
    <text x="127" y="34" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="800" font-size="22" fill="#FFD166" text-anchor="middle">
      3060 쉬운 영어
    </text>
  </g>

  <!-- MAIN HEADLINE (ULTRA LARGE, MOBILE-OPTIMIZED) -->
  <!-- Line 1: Question Hook -->
  <g transform="translate(560, 205)" filter="url(#text-stroke-bg)">
    <text x="0" y="0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="900" font-size="76" fill="url(#yellow-text-grad)" letter-spacing="-1">
      "보고 싶어요"
    </text>
  </g>

  <!-- Line 2: The Dilemma Hook -->
  <g transform="translate(560, 295)" filter="url(#text-stroke-bg)">
    <text x="0" y="0" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" letter-spacing="-1">
      영어로 바로 안 나온다면?
    </text>
  </g>

  <!-- Giant Callout Highlight Box -->
  <g transform="translate(560, 345)" filter="url(#heavy-shadow)">
    <!-- Background Glow Box -->
    <rect width="660" height="150" rx="28" fill="#150d2a" stroke="url(#cyan-grad)" stroke-width="5"/>
    
    <!-- Inner Accent Content -->
    <text x="35" y="60" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="900" font-size="36" fill="#FFD166">
      쉬운 단어 2개로 끝!
    </text>
    
    <text x="35" y="115" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF">
      입에서 <tspan fill="#00E676" font-size="50">1초 만에</tspan> 터지는 법
    </text>

    <!-- Pointing Finger / Flame Stamp -->
    <g transform="translate(540, 20)" filter="url(#glow-orange)">
      <circle cx="50" cy="50" r="45" fill="url(#pink-grad)"/>
      <text x="50" y="63" font-size="42" text-anchor="middle">⚡</text>
    </g>
  </g>

  <!-- Bottom Key Value Benefits (3 Pillars) -->
  <g transform="translate(560, 525)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="205" height="65" rx="16" fill="#22153b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
      <text x="102" y="40" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="800" font-size="22" fill="#00F2FE" text-anchor="middle">
        무한 반복 발음
      </text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(225, 0)">
      <rect width="205" height="65" rx="16" fill="#22153b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
      <text x="102" y="40" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="800" font-size="22" fill="#FFD166" text-anchor="middle">
        왕초보 눈높이
      </text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(450, 0)">
      <rect width="210" height="65" rx="16" fill="#22153b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
      <text x="105" y="40" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="800" font-size="22" fill="#00E676" text-anchor="middle">
        실생활 100% 활용
      </text>
    </g>
  </g>

  <!-- Dynamic Curved Attention Arrow (Pointing from text to solution) -->
  <path d="M 520 220 Q 560 160 520 120" fill="none" stroke="#FFD166" stroke-width="6" stroke-dasharray="8 6" filter="url(#glow-orange)"/>

  <!-- 4. BOTTOM POWER BAR (CLICK-DRIVING BANNER) -->
  <g transform="translate(0, 640)">
    <rect width="1280" height="80" fill="#090314"/>
    <line x1="0" y1="0" x2="1280" y2="0" stroke="url(#badge-grad)" stroke-width="4"/>
    
    <text x="640" y="48" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-weight="900" font-size="30" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      급할 때 바로 쓰는 <tspan fill="#FFF500">초간단 20문장</tspan> 지금 바로 확인하세요! ➔
    </text>
  </g>

  <!-- Visual Sparkles & Micro Details -->
  <g fill="#FFF500" opacity="0.9">
    <!-- Star 1 -->
    <path d="M 530 180 L 534 192 L 546 196 L 534 200 L 530 212 L 526 200 L 514 196 L 526 192 Z" />
    <!-- Star 2 -->
    <path d="M 1200 280 L 1203 289 L 1212 292 L 1203 295 L 1200 304 L 1197 295 L 1188 292 L 1197 289 Z" />
    <!-- Star 3 -->
    <path d="M 1150 490 L 1152 496 L 1158 498 L 1152 500 L 1150 506 L 1148 500 L 1142 498 L 1148 496 Z" />
  </g>

  <!-- Big Dramatic Action Arrow (CTR Booster) -->
  <g transform="translate(1180, 380)" filter="url(#glow-orange)">
    <path d="M 0 0 L 40 30 L 0 60 L 10 30 Z" fill="#FF8A00" transform="rotate(15)"/>
  </g>

</svg>