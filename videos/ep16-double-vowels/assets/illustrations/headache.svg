<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Dizzy Sparkles / Pain Pulses -->
  <path d="M 30 25 L 36 22 L 32 30" fill="none" stroke="#D64545" stroke-width="3" stroke-linecap="round"/>
  <path d="M 88 22 L 82 25 L 86 32" fill="none" stroke="#D64545" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="16" r="3.5" fill="#D64545"/>
  <path d="M 52 14 L 68 18" stroke="#D64545" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cute Head Body -->
  <circle cx="60" cy="65" r="42" fill="#FFF4F4" stroke="#2B2B2B" stroke-width="4"/>

  <!-- Cute Headache Bandage on Forehead -->
  <rect x="34" y="38" width="52" height="18" rx="8" fill="#FFE3E3" stroke="#2B2B2B" stroke-width="3"/>
  <path d="M 54 47 L 66 47" stroke="#D64545" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 60 41 L 60 53" stroke="#D64545" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Wincing Eyes (> <) -->
  <path d="M 40 68 L 48 72 L 40 76" fill="none" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 80 68 L 72 72 L 80 76" fill="none" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cheeks with Blushing Stress -->
  <circle cx="38" cy="80" r="5" fill="#FF8787" opacity="0.8"/>
  <circle cx="82" cy="80" r="5" fill="#FF8787" opacity="0.8"/>

  <!-- Wobbly 'Ouch' Mouth -->
  <path d="M 53 87 Q 60 81 67 87" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>

  <!-- Hand Touching Temples / Forehead -->
  <g transform="translate(18, 56)">
    <circle cx="6" cy="14" r="10" fill="#FFE8E8" stroke="#2B2B2B" stroke-width="3.5"/>
    <path d="M 6 8 L 6 18" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/>
  </g>
