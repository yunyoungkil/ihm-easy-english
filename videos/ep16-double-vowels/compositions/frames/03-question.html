<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["03-question"] = tl;

  var word = document.getElementById("f03-word");
  var qO = document.getElementById("f03-q-o");
  var qA = document.getElementById("f03-q-a");

  // "BOAT, 이 단어를 보면..." — word settles in first.
  tl.to(word, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 0.3);

  // Retimed 2026-09-16 against real whisper timestamps (assets/voice/03.words.json) — the

  // — alternating flicker fills this whole open-question span, four rounds, authored
  // explicitly (no repeat/yoyo per project negative list).
  var start = 7.5;
  var beat = 0.91;
  for (var i = 0; i < 4; i++) {
    var t0 = start + i * beat * 2;
    tl.to(qO, { opacity: 1, duration: beat * 0.35 }, t0);
    tl.to(qO, { opacity: 0, duration: beat * 0.35 }, t0 + beat * 0.55);
    tl.to(qA, { opacity: 1, duration: beat * 0.35 }, t0 + beat);
    tl.to(qA, { opacity: 0, duration: beat * 0.35 }, t0 + beat * 1.55);
  }

  // "그것도 아니면 둘 다 내야 할까요?" (둘 다 spoken at 14.82s) — both letters pulse together,
  // holding through the end of the question (16.98s).
  tl.to([qO, qA], { opacity: 1, duration: 0.3 }, 14.8);
  tl.to([qO, qA], { opacity: 0, duration: 0.4 }, 16.9);
})();
