    tl.fromTo("#hostImgF3", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 12.2);

    // f4 — surprised, holds through "인식이 안 되고" (recognition doesn't happen, 13.19-14.44s)
    tl.set("#hostImgF4", { display: "block" }, 13.0);
    tl.to("#hostImgF3", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 13.0);
    tl.fromTo("#hostImgF4", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 13.0);
    tl.to("#hostCard", { scale: 1.05, duration: 0.06 }, 13.0);
    tl.to("#hostCard", { scale: 1, duration: 0.18, ease: "back.out(2.5)" }, 13.06);

    // f5 — surprised → shocked, starts right as "시뻘건" (bright red) begins (14.65s)
    tl.set("#hostImgF5", { display: "block" }, 14.6);
    tl.to("#hostImgF4", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 14.6);
    tl.fromTo("#hostImgF5", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 14.6);

    // f6 — shocked, lands with "오답" (wrong answer, 15.38s) — this is where the phone's error
    // card and screen-shake now land too, so the host's shock and the visual cause appear together
    tl.set("#hostImgF6", { display: "block" }, 15.3);
    tl.to("#hostImgF5", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 15.3);
    tl.fromTo("#hostImgF6", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 15.3);
    tl.to("#hostCard", { scale: 1.08, y: -10, duration: 0.08 }, 15.3);
    tl.to("#hostCard", { scale: 1.03, y: -3, duration: 0.1, ease: "power1.out" }, 15.38); // don't fully settle — keep bouncing into the peak frame

    tl.to("#phoneMockup", { x: "-=4", yoyo: true, repeat: 6, duration: 0.04 }, 15.3); // 2px screen shake
    tl.to("#errorCallout", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 15.35);
    tl.to("#hostShockLines", { opacity: 1, duration: 0.15 }, 15.3);

    // Error screen photo — same "avatar motion" language as the host swaps (crossfade +
    // punch-then-settle), not a generic box pop-in, so the phone's reveal reads as part of
    // the same narration-synced system instead of a separate UI animation (사용자 요청).
    tl.fromTo("#errorImg", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1.06, duration: 0.3, ease: "power1.inOut" }, 15.35);
    tl.to("#errorImg", { scale: 1, duration: 0.18, ease: "back.out(2.5)" }, 15.65);

    // f7 — shocked peak, lands with "떴던" (had popped up, 16.17s) — holds through "답답한 경험"
    // before settling as sentence 3 begins at 17.5s
    tl.set("#hostImgF7", { display: "block" }, 16.15);
    tl.to("#hostImgF6", { opacity: 0, duration: 0.3, ease: "power1.inOut" }, 16.15);
    tl.fromTo("#hostImgF7", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.inOut" }, 16.15);
    tl.to("#hostCard", { scale: 1, y: 0, duration: 0.25, ease: "back.out(2.5)" }, 16.15);

    tl.to("#hostShockLines", { opacity: 0, duration: 0.3 }, 16.8);

    // Sentence 3 (17.5s ~ 28.3s)
    tl.to("#cap2", { opacity: 0, duration: 0.15 }, 17.3);
    tl.to("#cap3", { opacity: 1, duration: 0.2 }, 17.5);
    tl.to("#hostBubble", { scale: 1.06, yoyo: true, repeat: 3, duration: 0.3 }, 18.5);

    // Sentence 4 (28.6s ~ 35.8s)
    tl.to("#cap3", { opacity: 0, duration: 0.15 }, 28.4);
    tl.to("#cap4", { opacity: 1, duration: 0.2 }, 28.6);

    // Sentence 5 (36.0s ~ 44.2s)
    tl.to("#cap4", { opacity: 0, duration: 0.15 }, 35.8);
    tl.to("#cap5", { opacity: 1, duration: 0.2 }, 36.0);

    // Sentence 6 (44.5s ~ 58.5s)
    tl.to("#cap5", { opacity: 0, duration: 0.15 }, 44.3);
    tl.to("#cap6", { opacity: 1, duration: 0.2 }, 44.5);

    // Solution Gold Banner appears at 45.0s — it covers the whole phone card
    // (inset: 4cqh 3cqw), so the word rows/error callout underneath must fade
    // out first or the linter (correctly) flags a text overlap with the
    // still-visible "WORLD ❌ FAIL" row.
    tl.to(["#rowApple", "#rowWater", "#rowWorld", "#errorCallout"], { opacity: 0, duration: 0.3 }, 44.7);
    tl.to("#solutionBanner", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 45.0);

    // Frame exit
    tl.to(["#hostCard", "#phoneMockup", "#hookBadge", "#cap6"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 58.6);

    window.__timelines = window.__timelines || {};
    window.__timelines["01-cold-open"] = tl;
    tl.seek(0);
  })();
</script>
