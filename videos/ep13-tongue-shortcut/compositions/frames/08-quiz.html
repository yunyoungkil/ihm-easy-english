  var RATIO = 43.04 / 23.4;

  tl.call = function (fn, params, p) { return _call(fn, params, typeof p === "number" ? p * RATIO : p); };

  var badge = document.getElementById("f08-badge");
  var question = document.getElementById("f08-question");
  var chipRow = document.getElementById("f08-mini-chip-row");
  var mc1 = document.getElementById("f08-mc1"), mc1L = document.getElementById("f08-mc1-letter"), mc1S = document.getElementById("f08-mc1-sound");

  var answerPron = document.getElementById("f08-answer-pron");
  var answerLabel = document.getElementById("f08-answer-label");

  // Initial hidden state lives entirely in static HTML/CSS (style="display:none" on the
  // label, opacity:0 in CSS on the chips/answer) — a tl.set(...) at t=0 wouldn't render at
  // the exact playhead-0 frame, so nothing re-establishes it inside the timeline here.

  function clearRound(t) {
    tl.set(badge, { opacity: 0 }, t)
      .set(question, { opacity: 0 }, t)
      .set([mc1, mc2, mc3], { opacity: 0 }, t)
      .set(answerWrap, { opacity: 0 }, t)

  function askWithChips(t, num, q, letters, sounds) {
    clearRound(t);
    tl.call(function () {
      mc1L.textContent = letters[0]; mc1S.textContent = sounds[0];
      mc2L.textContent = letters[1]; mc2S.textContent = sounds[1];

  }

  function revealChips(t) {
    tl.fromTo(mc1, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(1.4)" }, t)

      answerWord.textContent = word;
      answerPron.textContent = pron;
      if (labelText) {
        answerLabel.textContent = labelText;
        answerLabel.className = "f08-answer-label" + (labelType === "exc" ? " f08-answer-label--exc" : "");
        answerLabel.style.display = "inline-block";
      } else {
        answerLabel.style.display = "none";
      }
    }, null, t);
    // Only dim the mini-chips down (rather than leaving them at their already-hidden
    // opacity:0) when this round actually populated and revealed them — otherwise this
    // would resurrect stale text left over from an earlier round's chips (CUP/CELL never
    // call revealChips(), so mc1-3 still hold whatever the last chip round wrote into them).
    if (dimChips) tl.to([mc1, mc2, mc3], { opacity: 0.25, duration: 0.2 }, t);
    tl.fromTo(answerWrap, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.5)" }, t + 0.05);
  }

  // Round 1 (0.0-6.0s VO, "GAP이라는 단어... 잠깐 생각해 보시고"): question + pause.

  tl.fromTo(question, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, R3 + 0.15);
  revealAnswer(R3 + 2.6, "CUP", "컵", "정답: 크 (규칙)", "ok", false);

  // Round 4 (18.0-23.4s VO, "마지막으로 CELL은요?... 정답은 스"): exception color.

  tl.fromTo(progressFillEl, { width: "58.333%" }, { width: "66.667%", duration: 1.0, ease: "power1.inOut" }, R4 + 2.0);
})();
