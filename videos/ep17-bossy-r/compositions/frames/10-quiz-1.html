  // Progress Bar

      if (i === idx) slot.classList.add("active");
      else slot.classList.remove("active");
    });
  }

  // --- Q1: smart (8.16s ~ 16.5s) ---
  tl.call(function () {
    wordEl.innerHTML = 'sm<span style="color:#8A5A12; text-decoration:underline;">ar</span>t';

    stamp.style.color = "#8A5A12";

  tl.fromTo(card, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.5)" }, 8.16);

  tl.call(function () { highlightSlot(0); }, null, 13.24);

  // --- Q2: short (17.0s ~ 26.5s) ---
  tl.to([card, stamp], { opacity: 0, scale: 0.9, duration: 0.25 }, 16.7);
  tl.call(function () {

    stamp.textContent = "🎯 2번 OR 정답!";
    stamp.style.borderColor = "#963E00";
    stamp.style.color = "#963E00";
    highlightSlot(-1);
  }, null, 17.0);

  tl.to(card, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.5)" }, 17.0);

  tl.to([card, stamp], { opacity: 0, scale: 0.9, duration: 0.25 }, 26.7);
