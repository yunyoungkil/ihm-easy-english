(function () {

  var flashStart = 0.5;
  var flashGap = 2.0;
  words.forEach(function (w, i) {
    var t = flashStart + i * flashGap;
    tl.call(function () { flashWord.textContent = w; }, null, t);
    tl.fromTo(flashWord, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.4)" }, t);

  // Scene 2 (10.0-17.0s VO, "처음 보는 단어 앞에서... 또 풀어드릴게요"): tagline settles center.
