<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["10-practice"] = tl;

  var enWord = document.getElementById("f10-en");
  var syllables = document.getElementById("f10-syllables");
  var syl1 = document.getElementById("f10-syl-1");
  var syl2 = document.getElementById("f10-syl-2");
  var card = document.querySelector(".f10-card");

  // Retimed 2026-09-16 against real whisper timestamps (assets/voice/10.words.json) — the old
  // uniform offsets (+0.3/+1.1/+1.9/+3.2s from a single "start") assumed each word's slow-build
  // + fast-repeat beats were evenly spaced ~1s apart, but the real narration spreads them over
  // ~12s per word ("BOAT," 8.78s ... 보,11.51s ... 트12.61s ... 보트!15.19s ... 보트,20.17s ...
  // 보트.21.08s). Each beat now gets its own real timestamp instead of a relative offset.
  var WORDS = [
    { en: 'B<span style="color:#8A5A12">OA</span>T', syls: ["보", "트"], color: "#8A5A12", reset: 8.6, syl1: 11.5, syl2: 12.6, merge: 15.1, pulse1: 20.1, pulse2: 21.0 },
    { en: 'M<span style="color:#8A5A12">EA</span>T', syls: ["미", "트"], color: "#8A5A12", reset: 22.9, syl1: 24.8, syl2: 25.6, merge: 27.9, pulse1: 33.1, pulse2: 34.0 },
    { en: 'H<span style="color:#D64545">EA</span>D', syls: ["헤", "드"], color: "#D64545", reset: 38.5, syl1: 40.4, syl2: 40.8, merge: 43.4, pulse1: 47.8, pulse2: 48.6 }
  ];

  WORDS.forEach(function (w) {
    tl.call(function () {
      enWord.innerHTML = w.en;
      enWord.style.opacity = 0;
      syl1.textContent = w.syls[0];
      syl2.textContent = w.syls[1];
      syllables.style.color = "#2B2B2B";
      syl1.style.opacity = 0.3;
      syl2.style.opacity = 0.3;
    }, null, w.reset);

    // English spelling reveals first (this is the word the illustration/syllables below are
    // sounding out) — the card previously only ever showed Korean syllables, never the English
    // word itself, so viewers couldn't tell which word was being practiced without the caption.
    tl.to(enWord, { opacity: 1, duration: 0.4 }, w.reset + 0.1);

    // Slow build: syllables light up one at a time, then a scale+color pop marks the merge —
    // one Korean text element throughout (previously a separate "full word" element crossfaded
    // in on top of the syllables, so the same pronunciation briefly showed twice, stacked).
    // Scale, not font-size/gap, drives the "merge" beat — animating layout properties (font-size,
    // gap) reflows text and snaps to integer device pixels under the seek-by-frame renderer.
    tl.to(syl1, { opacity: 1, duration: 0.5 }, w.syl1);
    tl.to(syl2, { opacity: 1, duration: 0.5 }, w.syl2);
    tl.to(card, { scale: 1.05, duration: 0.3 }, w.merge);
    tl.to(card, { scale: 1, duration: 0.3 }, w.merge + 0.3);
    tl.to(syllables, { scale: 1.12, color: w.color, duration: 0.3 }, w.merge);
    tl.to(syllables, { scale: 1, duration: 0.2 }, w.merge + 0.3);

    // Fast repeat: word pulses twice, quickly, on the two real repeated utterances.
    tl.to(syllables, { scale: 1.08, duration: 0.15 }, w.pulse1);
    tl.to(syllables, { scale: 1, duration: 0.15 }, w.pulse1 + 0.15);
    tl.to(syllables, { scale: 1.08, duration: 0.15 }, w.pulse2);
    tl.to(syllables, { scale: 1, duration: 0.15 }, w.pulse2 + 0.15);
  });

  // Narration-coverage caption-pill: the lead-in instruction and the two short English-word
  // announcements have no on-screen text — the card only ever shows Korean syllables (real
  // timestamps, assets/voice/10.words.json).
  var captionZone = document.getElementById("f10-caption-zone");
  var captionText = document.getElementById("f10-caption-text");
  function setCaption10(txt) { captionText.textContent = txt; }
  tl.set(captionZone, { opacity: 0 }, 0);

  function flashCaption10(text, at, outAt) {
    tl.call(setCaption10, [text], at);
    tl.fromTo(captionZone, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
    tl.to(captionZone, { opacity: 0, duration: 0.25, ease: "power2.in" }, outAt);
  }
  flashCaption10("자, 이제 직접 소리 내서 읽어보세요.", 0.512, 4.0);
  flashCaption10("따라 읽다 보면 저절로 자신감이 붙으실 거예요.", 4.284, 8.5);
  flashCaption10("이번엔 MEAT예요.", 22.038, 24.4);
  flashCaption10("마지막으로 예외였던 단어도 같이 볼까요. HEAD예요.", 35.038, 40.0);
})();
</script>
