  @font-face {
    font-family: 'Archivo Black'; font-weight: 400; font-style: normal;
    src: url('https://fonts.gstatic.com/s/archivoblack/v23/HTxqL289NzCGg4MzN6KJ7eW6OYs.ttf') format('truetype');
  }
  @font-face {
    font-family: 'Noto Sans KR'; font-weight: 700; font-style: normal;

  }
  @font-face {
    font-family: 'Noto Sans KR'; font-weight: 900; font-style: normal;

  }

  #root {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: #0A1526; color: #FFFFFF; font-family: 'Noto Sans KR', sans-serif;
    container-type: size;
  }
  #root * { box-sizing: border-box; }
  .clip { position: absolute; inset: 0; }

  .f10-bg { background: radial-gradient(circle at 50% 46%, #12203A 0%, #0A1526 62%); }

  .f10-progress-fill { position: absolute; left: 0; top: 0; width: 75%; height: 3px; background: #F5C518; }

  .f10-prompt { position: absolute; left: 0; right: 0; top: 12cqh; text-align: center; font-size: 1.9cqw; font-weight: 700; color: #A9B4C4; opacity: 0; }

  .f10-stage { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqh; }

  .f10-chip-row { position: relative; display: flex; align-items: center; justify-content: center; gap: 2.2cqw; }

  .f10-chip {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 1cqh;
    width: 7.5cqw; padding: 1.4cqh 0; border-radius: 14px; border: 2px solid rgba(245,197,24,0.25);
    background: rgba(18,32,58,0.85); opacity: 0;
  }
  .f10-chip-letter { font-family: 'Archivo Black', sans-serif; font-size: 3.4cqw; color: #FFFFFF; line-height: 1; }
  .f10-chip-sound { font-size: 1.3cqw; font-weight: 700; color: #008EFF; }
  .f10-chip--exc { border-color: rgba(255,0,0,0.5); }
  .f10-chip--exc .f10-chip-sound { color: #FF0000; }

  .f10-result { display: flex; flex-direction: column; align-items: center; gap: 1.4cqh; opacity: 0; }
  .f10-result-word { font-family: 'Archivo Black', sans-serif; font-size: 7cqw; color: #FFFFFF; line-height: 1; }
  .f10-result-word .exc-letter { color: #FF0000; }
  .f10-result-pron { font-size: 2.4cqw; font-weight: 900; color: #F5C518; }

<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["10-practice"] = tl;

  var chipRow = document.getElementById("f10-chip-row");
  var connectorFill = document.getElementById("f10-connector-fill");
  var c1 = document.getElementById("f10-c1"), c1l = document.getElementById("f10-c1-l"), c1s = document.getElementById("f10-c1-s");
  var c2 = document.getElementById("f10-c2"), c2l = document.getElementById("f10-c2-l"), c2s = document.getElementById("f10-c2-s");
  var c3 = document.getElementById("f10-c3"), c3l = document.getElementById("f10-c3-l"), c3s = document.getElementById("f10-c3-s");
  var result = document.getElementById("f10-result");
  var resultWord = document.getElementById("f10-result-word");
  var resultPron = document.getElementById("f10-result-pron");
  var progressFillEl = document.getElementById("f10-progress-fill");

  tl.fromTo(document.getElementById("f10-prompt"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);

  // Real cue points measured from assets/voice/10.wav via whisper.cpp (word + token pass,
  // TASKS.md 6단계, 2026-09-06) — replaces this frame's old RATIO uniform-scaling. The user's
  // own SCRIPT.md Line 10 timestamps (rounded to the nearest second while watching) confirmed
  // the right vicinity for Rounds 1-3 (예: 브/애/그 ≈7.7/8.7/10.0s), but whisper's sub-second
  // token timing is what's actually used below since it's precise instead of rounded.
  //   0.00-7.38 "자 이번엔 직접 해보세요. 아까처럼 소리 하나씩 힘 빼고 이어볼게요."
  //   7.76 B / 8.83 A / 10.01 G — 12.50 "백!" — 17.09/17.97 repeat "백. 백."
  //   18.40 "이번엔 캣이에요." — 21.20 C / 22.27 A / 23.44 T — 25.91 "캣!"
  //   31.88 "이번엔 맵." — 34.52 M / 35.41 A / 36.68 P — 39.48 "맵!"
  //   45.44 "마지막으로 예외도 같이 해볼까요? 셀이에요. 뒤에 이가 왔으니까 C는 스로 바뀌죠."
  //   ⚠️ Round 4's actual "스, 에, 을" chip letters (as opposed to the explanatory mention
  //   just before them) come out unusually fast in the real TTS — all 3 inside a 0.34s window
  //   (57.40/57.52/57.61) versus ~1.1s apart in Rounds 1-3. Synced to the real audio as
  //   measured; flagged for the user in case that line is worth regenerating for pacing.
  //   59.56 "셀!"
  // Repeat-pulse pairs for Rounds 2-4 fall inside whisper segments whose exact sub-timestamps
  // came out garbled (short interjections are whisper's known weak spot — see CLAUDE.md), so
  // those 4 pairs are interpolated from Round 1's precisely-measured repeat spacing
  // (+4.59s / +0.88s after the result reveal) rather than guessed from scratch.

  function round(cue, letters, sounds, wordHtml, pron, exceptionFirst) {
    var t = cue.reset;
    // Reset stage.
    tl.set([c1, c2, c3], { opacity: 0 }, t)
      .set(chipRow, { opacity: 1 }, t)
      .set(connectorFill, { width: "0%" }, t)
      .set(result, { opacity: 0, scale: 1 }, t)
      .set(c1, { className: "f10-chip" + (exceptionFirst ? " f10-chip--exc" : "") }, t);
    tl.call(function () {
      c1l.textContent = letters[0]; c1s.textContent = sounds[0];
      c2l.textContent = letters[1]; c2s.textContent = sounds[1];
      c3l.textContent = letters[2]; c3s.textContent = sounds[2];
      resultWord.innerHTML = wordHtml;
      resultPron.textContent = pron;
    }, null, t);

    // Chips appear left to right, each timed to its own letter's real speech onset, with the
    // connector filling shortly after.
    var fillLead = cue.letters[1] - cue.letters[0] < 0.5 ? 0.05 : 0.2; // Round 4's compressed gap
    tl.fromTo(c1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.4)" }, cue.letters[0]);
    tl.to(connectorFill, { width: "33%", duration: 0.25 }, cue.letters[0] + fillLead);
    tl.fromTo(c2, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.4)" }, cue.letters[1]);
    tl.to(connectorFill, { width: "66%", duration: 0.25 }, cue.letters[1] + fillLead);
    tl.fromTo(c3, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.4)" }, cue.letters[2]);
    tl.to(connectorFill, { width: "100%", duration: 0.25 }, cue.letters[2] + fillLead);

    // Converge into the assembled result exactly as "이어 붙이면, ○○!" lands.
    tl.to(chipRow, { opacity: 0, scale: 0.94, duration: 0.3, ease: "power2.inOut" }, cue.result - 0.3);
    tl.fromTo(result, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, cue.result);

    // "다시 한 번, 좀 더 빠르게" — 2x repeat pulse on the landed word.
    tl.to(resultWord, { scale: 1.1, duration: 0.14, ease: "power1.out" }, cue.pulses[0])
      .to(resultWord, { scale: 1, duration: 0.18, ease: "power1.in" }, cue.pulses[0] + 0.14);
    tl.to(resultWord, { scale: 1.1, duration: 0.14, ease: "power1.out" }, cue.pulses[1])
      .to(resultWord, { scale: 1, duration: 0.18, ease: "power1.in" }, cue.pulses[1] + 0.14);
  }

  // Round 1: BAG.
  round({ reset: 7.0, letters: [7.76, 8.83, 10.01], result: 12.50, pulses: [17.09, 17.97] },
    ["B", "A", "G"], ["브", "애", "그"], "BAG", "백", false);

  // Round 2: CAT.
  round({ reset: 18.40, letters: [21.20, 22.27, 23.44], result: 25.91, pulses: [29.90, 30.80] },
    ["C", "A", "T"], ["크", "애", "트"], "CAT", "캣", false);

  // Round 3: MAP.
  round({ reset: 31.88, letters: [34.52, 35.41, 36.68], result: 39.48, pulses: [42.80, 43.70] },
    ["M", "A", "P"], ["흠", "애", "프"], "MAP", "맵", false);

  // Round 4: CELL — exception color (the C chip and the hero word's leading letter switch to
  // red, matching Frame 7/8). Reset lands early (right as "마지막으로 예외도..." starts) so the
  // red-tinted empty stage is already visible while the narrator explains why this one differs.
  round({ reset: 45.44, letters: [57.40, 57.52, 57.61], result: 59.56, pulses: [62.90, 63.78] },
    ["C", "E", "LL"], ["스", "에", "을"], "<span class='exc-letter'>C</span>ELL", "셀", true);

  tl.fromTo(progressFillEl, { width: "75%" }, { width: "83.333%", duration: 1.0, ease: "power1.inOut" }, 0.3);
})();
