  // ---- Scene 2 (3.0-8.0s): step-badge 1 lands (center-outward-expansion) + description ----

  var BADGE1_TRIGGER = 3.0;
  tl.fromTo("#m04mechanism-badge1",

    BADGE1_TRIGGER
