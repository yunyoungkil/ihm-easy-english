  // exception card lands separately on "그리고 EA는... 예외까지"(9.82s).
  tl.to(regularCards, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.41, ease: "power2.out" }, 3.7);
  tl.to(exceptionCards, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 9.7);

  // "이제 모음 두 개가 붙은..." (15.87s) — closing line, hand-lettered.

  tl.to([grid, line], { opacity: 0, duration: 1.2, ease: "power1.out" }, endscreenStart);
  tl.to(wordmark, { scale: 0.85, duration: 0.6 }, endscreenStart);

  // CSS comment for why the final ~7s of narration is intentionally left audio-only.

  var captionText = document.getElementById("f12-caption-text");
  function setCaption12(txt) { captionText.textContent = txt; }
