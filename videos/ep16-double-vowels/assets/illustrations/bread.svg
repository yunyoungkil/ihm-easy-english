<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- BREAD (Loaf of bread) sticker in Neo-brutalist style -->
  <g stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bread Loaf Base & Crust -->
    <!-- Drop Shadow / 3D depth side -->
    <path d="M 85 45 C 96 45, 102 55, 102 68 L 102 85 C 102 92, 95 95, 88 95 L 35 95" fill="#D9480F" />
    
    <!-- Main Loaf Body -->
    <path d="M 32 95 
             L 86 95 
             C 94 95, 98 90, 98 82 
             L 98 65 
             C 98 52, 90 42, 78 42 
             C 74 34, 62 30, 52 32 
             C 42 30, 28 36, 24 48 
             C 16 54, 18 70, 20 82 
             C 22 90, 26 95, 32 95 Z" fill="#F59F00" />

    <!-- Front Slice Face -->
    <path d="M 28 92 
             L 58 92 
             C 64 92, 68 88, 68 80 
             L 68 62 
             C 68 50, 60 42, 50 42 
             C 42 42, 36 46, 32 50 
             C 24 46, 18 56, 18 68 
             C 18 80, 22 92, 28 92 Z" fill="#FFF3BF" />

    <!-- Crust Cuts / Scoring on top of loaf -->
    <path d="M 52 40 C 56 46, 62 50, 66 52" fill="none" stroke="#D9480F" stroke-width="3" />
    <path d="M 72 45 C 76 50, 82 54, 86 56" fill="none" stroke="#D9480F" stroke-width="3" />

    <!-- Cute Toast Face on front slice -->
    <circle cx="36" cy="68" r="2.5" fill="#2B2B2B" stroke="none" />
    <circle cx="50" cy="68" r="2.5" fill="#2B2B2B" stroke="none" />
    <path d="M 41 74 Q 43 77 45 74" fill="none" stroke="#2B2B2B" stroke-width="2.5" />
    <!-- Pink cheeks -->
    <circle cx="32" cy="73" r="2.5" fill="#FFA8A8" stroke="none" />
    <circle cx="54" cy="73" r="2.5" fill="#FFA8A8" stroke="none" />

    <!-- Warm Steam Swirls -->
    <path d="M 40 24 Q 38 18 42 14" fill="none" stroke="#E8A93E" stroke-width="2.5" />
    <path d="M 55 20 Q 53 14 57 10" fill="none" stroke="#E8A93E" stroke-width="2.5" />
    <path d="M 70 24 Q 68 18 72 14" fill="none" stroke="#E8A93E" stroke-width="2.5" />
  </g>
</svg>
