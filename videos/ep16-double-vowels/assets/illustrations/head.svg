<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- HEAD (tapping head / thinking) sticker in Neo-brutalist style -->
  <g stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Big Head / Face -->
    <circle cx="58" cy="62" r="38" fill="#FFE8CC" />
    
    <!-- Hair -->
    <path d="M 24 55 
             C 20 35, 35 22, 58 22 
             C 80 22, 95 32, 94 52 
             C 88 42, 78 38, 65 42 
             C 52 36, 38 42, 32 52 Z" fill="#2B2B2B" />

    <!-- Cute Face features -->
    <!-- Eyes (blinking / curious) -->
    <circle cx="48" cy="62" r="4" fill="#2B2B2B" stroke="none" />
    <circle cx="72" cy="62" r="4" fill="#2B2B2B" stroke="none" />
    <!-- Eyebrows -->
    <path d="M 44 54 Q 48 51 52 54" fill="none" stroke="#2B2B2B" stroke-width="2.5" />
    <path d="M 68 54 Q 72 51 76 54" fill="none" stroke="#2B2B2B" stroke-width="2.5" />
    <!-- Smile -->
    <path d="M 54 74 Q 60 79 66 74" fill="none" stroke="#2B2B2B" stroke-width="3" />
    <!-- Cheeks -->
    <circle cx="42" cy="68" r="3.5" fill="#FFA8A8" stroke="none" />
    <circle cx="78" cy="68" r="3.5" fill="#FFA8A8" stroke="none" />

    <!-- Hand tapping on head / temple -->
    <path d="M 94 72 L 86 64 C 84 62, 80 64, 82 68 L 88 78 Z" fill="#FFE8CC" />
    
    <!-- Lightbulb / Idea Spark near head -->
    <path d="M 96 26 L 98 18 L 100 26 L 108 28 L 100 30 L 98 38 L 96 30 L 88 28 Z" fill="#F5C518" />
    <line x1="108" y1="16" x2="114" y2="10" stroke="#F5C518" stroke-width="3" />
  </g>
</svg>
