<script>
(function () {
  var TOTAL_DURATION = 13.505;
  var HARD_CUT = 7.5; // "정답, GONNA" cue — Scene 3 start

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  window.__timelines["03-reveal"] = tl;

  var setupWrap = document.getElementById('f03reveal-setup-wrap');
  var eyebrow = document.getElementById('f03reveal-eyebrow');
  var hero = document.getElementById('f03reveal-hero');
  var glow = document.getElementById('f03reveal-glow');

  // ── Scene 1 (0.0-2.5s): "GOING TO" per-word staggered reveal, white, upper-center. ──
  tl.fromTo(setupWrap, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.2);

  // ── Scene 2 (2.5-7.5s): hand-drawn strikethrough crosses "GOING TO" as it recedes
  //    (layered-depth — dims, never fully exits), "정답" eyebrow ticks in small. ──
  tl.fromTo('#f03reveal-cross .f03reveal-cross-fwd', { scaleX: 0, rotation: -4 }, { scaleX: 1, rotation: -4, duration: 0.3, ease: 'power2.out' }, 2.6);
  tl.fromTo('#f03reveal-cross .f03reveal-cross-bwd', { scaleX: 0, rotation: 4 }, { scaleX: 1, rotation: 4, duration: 0.3, ease: 'power2.out' }, 2.75);
  tl.to(setupWrap, { opacity: 0.4, duration: 0.4, ease: 'power1.inOut' }, 2.7);
  tl.fromTo(eyebrow, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 5.0);

  // ── Scene 3 (7.5-11.0s): hard-cut word-swap — GOING TO clears, GONNA slams in

  //    accent glow bloom lands as ONE beat with the slam. Then holds (climax). ──
  tl.set(setupWrap, { opacity: 0 }, HARD_CUT);
  tl.set(eyebrow, { opacity: 0 }, HARD_CUT);
  tl.set(hero, { opacity: 1 }, HARD_CUT);
  tl.fromTo(hero, { scale: 1.18 }, { scale: 1.0, duration: 0.32, ease: 'power3.out' }, HARD_CUT);

  var GLOW_PEAK = 0.32;
  var BLOOM_DUR = 0.9;

  // hold to end: bounded low-amplitude jitter only — no breathing, no drift, no repeat/yoyo.
  var HOLD_START = HARD_CUT + BLOOM_DUR;
  var HOLD_DUR = TOTAL_DURATION - HOLD_START;
  var phase = { p: 0 };
  tl.to(phase, {
    p: Math.PI * 2 * (HOLD_DUR / 2.6),
    duration: HOLD_DUR,
    ease: 'none',
    onUpdate: function () {
      var s = Math.sin(phase.p);
      hero.style.transform = 'translate(' + (s * 2).toFixed(2) + 'px, ' + (s * -1).toFixed(2) + 'px)';
      glow.style.opacity = String(GLOW_PEAK + s * 0.03);
    }
  }, HOLD_START);
})();
