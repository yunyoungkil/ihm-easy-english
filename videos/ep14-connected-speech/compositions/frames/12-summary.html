    function layout(geom, segs, head, length) {
      var step = length / segs.length;
      for (var i = 0; i < segs.length; i++) {
        var start = head - (i + 1) * step;
        start = ((start % geom.P) + geom.P) % geom.P;
        segs[i].setAttribute("stroke-dasharray", step + " " + (geom.P - step));
        segs[i].setAttribute("stroke-dashoffset", String(-start));
      }
    }

    // Active window per card = its own land() time -> the next card's land() time (card 7's
    // window ends when the thesis callback takes over focus and cards dim, at 16.476s).
    var WINDOWS = [
      { n: 1, start: 0.6, end: 2.7 },
      { n: 2, start: 2.7, end: 4.8 },
      { n: 3, start: 4.8, end: 6.9 },
      { n: 4, start: 6.9, end: 9.3 },
      { n: 5, start: 9.3, end: 11.7 },
      { n: 6, start: 11.7, end: 14.1 },
      { n: 7, start: 14.1, end: 16.476 },
    ];
    var BORDER_DELAY = 0.25;
    var FADE = 0.2;

    function activeCardForTime(t) {
      for (var i = 0; i < WINDOWS.length; i++) {
        var w = WINDOWS[i];
        if (t >= w.start + BORDER_DELAY && t < w.end) return w.n;
      }
      return null;
    }

    function render(t) {
      var n = activeCardForTime(t);
      if (n === null) return;
      var geom = CARD_GEOM[n];
      groupEl.setAttribute("transform", "translate(" + geom.x + "," + geom.y + ")");
      railEl.setAttribute("d", geom.d);
      railEl.setAttribute("stroke", geom.accent);
      railEl.setAttribute("stroke-width", String(THICKNESS));
      railEl.setAttribute("stroke-opacity", "0.12");
      layerEls.forEach(function (layer) {
        layer.el.setAttribute("stroke", layer.white ? "#ffffff" : layer.core ? geom.hot : geom.accent);
      });
      arcs.forEach(function (a) {
        a.glow.concat(a.core).forEach(function (seg) { seg.setAttribute("d", geom.d); });
        var head = headAt(geom, t + a.offset * BEAT);
        layout(geom, a.glow, head, geom.glowLen);
        layout(geom, a.core, head, geom.coreLen);
      });
    }

    var driver = { t: 0 };
    tl.to(driver, { t: 16.476, duration: 16.476, ease: "none", onUpdate: function () { render(driver.t); } }, 0);

    WINDOWS.forEach(function (win) {
      var bStart = win.start + BORDER_DELAY;
      tl.fromTo(wrap, { opacity: 0 }, { opacity: 1, duration: FADE }, bStart);
      tl.to(wrap, { opacity: 0, duration: FADE }, Math.max(bStart, win.end - FADE));
    });
  })();

  // Beat 7 (16.8s VO "이제 문장을 들을 때..."): thesis callback (Frame 4's exact phrase)
  // returns; cards dim to recede rather than compete for attention.
  tl.fromTo(amberGlow, { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.inOut" }, 16.476);
  tl.to(cards, { opacity: 0.4, duration: 0.8, ease: "power2.inOut" }, 16.476);
  tl.fromTo(thesis, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.3)" }, 16.8);

  // Beat 8 (21.8-32.4s VO, "다음에도...편하게 듣고 계실 거예요."): closing warmth plays under
  // the held thesis — no next-episode teaser (단편 방침).

  // Endscreen keep-out (production-rules.md 2026-09-07, last ~3s of this final frame): cards
  // and thesis fade, only the small top-left wordmark tag remains (2026-09-08 revision — moved
  // off-center on request, so the actual YouTube video-card + subscribe/logo elements the user
  // places in Studio have the center clear). The progress-rail also fades here even though it's
  // persistent chrome in every other frame — it spans the full width at the very top edge
  // (y:0-3px), which technically clips the top-center keep-out zone (y:0-170px); verified by
  // zoomed pixel snapshot on the pre-fix build (2026-09-08) — a solid yellow line was visible
  // inside that zone before this fix.
  tl.to(cards, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 29.5);
  tl.to(thesis, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 29.5);
  tl.to(amberGlow, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 29.5);
  tl.to(progressTrack, { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 29.5);
  tl.fromTo(wordmark, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 30.0);
})();
</script>
