<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["05-examples"] = tl;

  var DURATION = 26.41;
  var cards = document.querySelectorAll(".f05ex-card");

  // ---- anchor: pinned "gonna" — the throughline word across all 6 examples,
  // matching frame 10's anchor+list pattern (zone-based, not a floating
  // centered stack). spring-pop entrance, then pins for the whole frame. ----
  tl.fromTo(
    "#f05ex-anchor",
    { opacity: 0, scale: 0, y: 10 },
    { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "power3.out" },
    0.05,
  );

  // ---- ambient background texture: one slow-breathing accent glow behind the
  // card stack (seek-safe sine driver, bounded — no repeat/yoyo). ----
  var glowEl = document.getElementById("f05ex-glow");
  var glowDriver = { t: 0 };
  tl.to(
    glowDriver,
    {
      t: DURATION,
      duration: DURATION,
      ease: "none",
      onUpdate: function () {
        var s = Math.sin(glowDriver.t * 0.35);
        glowEl.style.transform = "scale(" + (1 + s * 0.08).toFixed(4) + ")";
        glowEl.style.opacity = (0.75 + s * 0.25).toFixed(3);
      },
    },
    0,
  );

  // blueprint: grid-card-assemble, short-path "direct-into-slot" variant of
  // center-outward-expansion — each card fades + slides a short local
  // distance into its own resting slot on its own voiceover cue, instead of
  // bursting from a shared center. Timed off HeyGen's own word-level
  // timestamps (audio_meta.json, frame 5) — each card lands just before its
  // own quote is spoken.
  var LAND = [0.4, 8.6, 10.4, 12.05, 14.5, 17.75];

  cards.forEach(function (card, i) {
    tl.fromTo(
      card,
      { y: 34, opacity: 0, scale: 0.96 },
      { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
      LAND[i]
    );
  });

  // asr-keyword-glow (default, non-karaoke style): "gonna"/"거너" stay
  // permanently accent-stress yellow (frame.md's fixed color-meaning law),
  // one linear driver sweeps scene time and modulates glow blur + scale on
  // every target-word span (en + ko share one data-word key per card) plus
  // that card's own border alpha, from one onUpdate loop over ALL words.
  var ATTACK_DUR = 0.15;
  var RELEASE = 0.35;
  var REST_LEVEL = 0.22;
  var MAX_BLUR = 20;
  var MAX_SCALE_BOOST = 0.08;

  // Final "...고잉 투 자리는 항상 GONNA로 들립니다" payoff: all six target
  // words glow once, synchronized to "GONNA로" itself.
  var SYNC = [25.16, 25.58];

  var TIMINGS = {
    card1: [[2.44, 2.639], [6.079, 6.659], SYNC], // "아임 거너 고 홈" then callback "...아니라 거너입니다"
    card2: [[9.899, 10.079], SYNC],                // "쉬즈 거너 콜 유"
    card3: [[11.5, 11.699], SYNC],                 // "히즈 거너 비 레이트"
    card4: [[13.259, 13.46], SYNC],                // "위아 거너 스타트 나우"
    card5: [[16.879, 17.119], SYNC],               // "아임 낫 거너 두 댓" (부정문)
    card6: [[19.779, 20.039], SYNC]                // "아 유 거너 컴" (의문문)
  };

  function envelope(t, windows) {
    var val = REST_LEVEL;
    for (var i = 0; i < windows.length; i++) {
      var start = windows[i][0];
      var end = windows[i][1];
      var e;
      if (t < start) continue;
      if (t < end) {
        e = Math.min((t - start) / ATTACK_DUR, 1);
      } else {
        var releaseEnd = end + RELEASE;
        e = t < releaseEnd ? 1 - ((t - end) / RELEASE) * (1 - REST_LEVEL) : REST_LEVEL;
      }
      if (e > val) val = e;
    }
    return val;
  }

  var words = document.querySelectorAll(".f05ex-hi");
  var driver = { t: 0 };

  tl.to(
    driver,
    {
      t: DURATION,
      duration: DURATION,
      ease: "none", // linear — t maps 1:1 to scene time, do not change
      onUpdate: function () {
        words.forEach(function (el) {
          var env = envelope(driver.t, TIMINGS[el.dataset.word]);
          el.style.textShadow =
            "0 0 " + (MAX_BLUR * env).toFixed(1) + "px rgba(245,197,24," + (0.25 + 0.65 * env).toFixed(2) + ")";
          el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(3) + ")";
        });
        cards.forEach(function (card, i) {
          var env = envelope(driver.t, TIMINGS["card" + (i + 1)]);
          card.style.borderColor = "rgba(245,197,24," + (0.25 + 0.35 * env).toFixed(2) + ")";
        });
      }
    },
    0
  );
})();
</script>
