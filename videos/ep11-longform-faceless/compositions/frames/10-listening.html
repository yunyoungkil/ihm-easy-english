      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var tl = gsap.timeline({ paused: true });

          // ---- ambient background texture: EQ/waveform strip, phase-offset sine
          // pulse (bounded, seek-safe — no repeat/yoyo/Math.random). Runs the full
          // frame duration so it reads under arbitrary seeks, not just playback.
          var WAVE_BAR_COUNT = 28;
          var wavesEl = document.getElementById("f10-listening-waves");
          var waveBars = [];
          for (var wi = 0; wi < WAVE_BAR_COUNT; wi++) {
            var bar = document.createElement("div");
            bar.className = "f10-listening-wave-bar";
            wavesEl.appendChild(bar);
            waveBars.push(bar);
          }
          var waveDriver = { t: 0 };
          tl.to(
            waveDriver,
            {
              t: 23.436,
              duration: 23.436,
              ease: "none",
              onUpdate: function () {
                for (var i = 0; i < waveBars.length; i++) {
                  var phase = i * 0.7;
                  var base = 14 + 10 * Math.sin(i * 1.3);
                  var s = Math.sin(waveDriver.t * 1.6 + phase);
                  var heightPx = base + 16 * ((s + 1) / 2);
                  waveBars[i].style.height = heightPx.toFixed(1) + "px";
                }
              },
            },
            0,
          );

          // ---- Scene 1 (0.0-3.5s): anchor spring-pop entrance, then pins forever. ----
          // spring-pop-entrance: calm/editorial settle, no overshoot, hero visible by t<=0.5s.
          tl.fromTo(
            "#f10-listening-anchor",
            { opacity: 0, scale: 0, y: 10 },
            { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "power3.out" },
            0.05,
          );

          // ---- one chip arrives per sentence, stacking — never moves again. ----
          // Timed off the stitched combined-audio word timeline (audio_meta.json,
          // frame 10 — Korean cues + real English example-sentence audio spliced
          // together, see SCRIPT.md Line 10). Each chip lands right as its ordinal
          // cue ("첫/두/세/네 번째") begins.
          var chipArrivals = [
            ["#f10-listening-chip1", 4.35],
            ["#f10-listening-chip2", 8.2],
            ["#f10-listening-chip3", 12.2],
            ["#f10-listening-chip4", 15.5],
          ];
          chipArrivals.forEach(function (entry) {
            tl.fromTo(
              entry[0],
              { opacity: 0, scale: 0, y: 26 },
              { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" },
              entry[1],
            );
          });

          // ---- asr-keyword-glow: one linear driver for every "gonna"/"거너" span. ----
          // Each chip's target word flashes once when spoken, decays to a lingering
          // breadcrumb glow; in Scene 6 all four chips + the anchor flash together
          // (synchronized) as the payoff — "same place, same sound" made visible.
          var ATTACK_DUR = 0.18;
          var RELEASE = 0.4;
          var MAX_BLUR = 22;
          var MAX_SCALE_BOOST = 0.09;
          var SYNC_START = 20.68;
          var SYNC_END = 21.6;

          // w1-w4 glow windows are the real English clip's own measured "gonna"
          // timestamp (not an estimate) — precise by construction.
          var TIMINGS = {
            w1: [
              { start: 6.411, end: 6.61, rest: 0.2 },
              { start: SYNC_START, end: SYNC_END, rest: 0.32 },
            ],
            w2: [
              { start: 10.712, end: 10.911, rest: 0.2 },
              { start: SYNC_START, end: SYNC_END, rest: 0.32 },
            ],
            w3: [
              { start: 14.028, end: 14.188, rest: 0.2 },
              { start: SYNC_START, end: SYNC_END, rest: 0.32 },
            ],
            w4: [
              { start: 17.325, end: 17.485, rest: 0.2 },
              { start: SYNC_START, end: SYNC_END, rest: 0.32 },
            ],
            anchor: [{ start: SYNC_START, end: SYNC_END, rest: 0.32 }],
          };

          function envelope(time, start, end, restLevel) {
            if (time < start) return 0;
            if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
            var releaseEnd = end + RELEASE;
            if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - restLevel);
            return restLevel;
          }

          function envelopeFor(time, windows) {
            var maxEnv = 0;
            for (var i = 0; i < windows.length; i++) {
              var w = windows[i];
              var e = envelope(time, w.start, w.end, w.rest);
              if (e > maxEnv) maxEnv = e;
            }
            return maxEnv;
          }

          var hitEls = Array.prototype.slice.call(document.querySelectorAll(".f10-listening-hit"));
          var driver = { t: 0 };
          tl.to(
            driver,
            {
              t: 23.436,
              duration: 23.436,
              ease: "none",
              onUpdate: function () {
                hitEls.forEach(function (el) {
                  var windows = TIMINGS[el.dataset.word];
                  if (!windows) return;
                  var env = envelopeFor(driver.t, windows);
                  var alpha = Math.min(0.85, env * 0.85);
                  el.style.textShadow = "0 0 " + (MAX_BLUR * env).toFixed(1) + "px rgba(245,197,24," + alpha.toFixed(2) + ")";
                  el.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env).toFixed(3) + ")";
                });
              },
            },
            0,
          );

          window.__timelines["10-listening"] = tl;
        })();
      </script>
