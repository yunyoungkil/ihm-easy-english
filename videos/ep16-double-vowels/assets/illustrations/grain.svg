<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Grain (Wheat stalk) sticker in Neo-brutalist style -->
  <g stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Stem -->
    <path d="M 60 105 C 60 70, 58 40, 60 15" fill="none" />
    
    <!-- Leaves / Wheat Grains -->
    <!-- Top grain -->
    <path d="M 60 15 C 55 8, 55 5, 60 5 C 65 5, 65 8, 60 15 Z" fill="#F5C518" />
    <line x1="60" y1="5" x2="60" y2="1" stroke-width="2" />
    
    <!-- Pair 1 -->
    <path d="M 60 26 C 45 20, 42 12, 50 10 C 58 8, 60 18, 60 26 Z" fill="#E8A93E" />
    <line x1="50" y1="10" x2="44" y2="5" stroke-width="2" />
    <path d="M 60 30 C 75 24, 78 16, 70 14 C 62 12, 60 22, 60 30 Z" fill="#F5C518" />
    <line x1="70" y1="14" x2="76" y2="9" stroke-width="2" />
    
    <!-- Pair 2 -->
    <path d="M 60 44 C 42 38, 38 28, 47 26 C 56 24, 59 36, 60 44 Z" fill="#F5C518" />
    <line x1="47" y1="26" x2="40" y2="20" stroke-width="2" />
    <path d="M 60 48 C 78 42, 82 32, 73 30 C 64 28, 61 40, 60 48 Z" fill="#E8A93E" />
    <line x1="73" y1="30" x2="80" y2="24" stroke-width="2" />

    <!-- Pair 3 -->
    <path d="M 60 62 C 42 56, 38 46, 47 44 C 56 42, 59 54, 60 62 Z" fill="#E8A93E" />
    <line x1="47" y1="44" x2="39" y2="38" stroke-width="2" />
    <path d="M 60 66 C 78 60, 82 50, 73 48 C 64 46, 61 58, 60 66 Z" fill="#F5C518" />
    <line x1="73" y1="48" x2="81" y2="42" stroke-width="2" />

    <!-- Pair 4 -->
    <path d="M 60 80 C 45 74, 42 66, 49 64 C 57 62, 59 72, 60 80 Z" fill="#F5C518" />
    <path d="M 60 84 C 75 78, 78 70, 71 68 C 63 66, 61 76, 60 84 Z" fill="#E8A93E" />
    
    <!-- Side leaf -->
    <path d="M 60 92 C 40 95, 30 105, 32 110 C 42 110, 52 102, 60 95" fill="#74C0FC" opacity="0" />
  </g>
</svg>
