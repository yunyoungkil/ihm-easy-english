<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- FOAM (soap bubbles) sticker in Neo-brutalist style -->
  <g stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shadow / Back bubbles -->
    <circle cx="85" cy="45" r="16" fill="#A5D8FF" />
    <circle cx="32" cy="55" r="18" fill="#A5D8FF" />
    <circle cx="75" cy="85" r="20" fill="#A5D8FF" />

    <!-- Main Bubble Cluster -->
    <path d="M 40 85 C 25 85, 20 70, 32 55 C 28 40, 45 32, 58 40 C 68 28, 88 32, 88 48 C 102 52, 105 72, 92 85 C 95 95, 80 102, 68 96 C 55 104, 38 98, 40 85 Z" fill="#E7F5FF" />
    
    <!-- Bubble details / highlights inside cluster -->
    <circle cx="52" cy="58" r="12" fill="#FFFFFF" />
    <circle cx="76" cy="66" r="14" fill="#FFFFFF" />
    
    <!-- Little shiny curves -->
    <path d="M 46 52 A 6 6 0 0 1 54 48" fill="none" stroke="#2B2B2B" stroke-width="2.5" />
    <path d="M 70 60 A 7 7 0 0 1 80 56" fill="none" stroke="#2B2B2B" stroke-width="2.5" />
    <path d="M 30 76 A 4 4 0 0 1 36 72" fill="none" stroke="#2B2B2B" stroke-width="2" />

    <!-- Detached floating bubbles -->
    <circle cx="26" cy="28" r="9" fill="#E7F5FF" />
    <path d="M 23 25 A 3 3 0 0 1 27 23" fill="none" stroke="#2B2B2B" stroke-width="2" />

    <circle cx="92" cy="24" r="6" fill="#E7F5FF" />
    
    <!-- Sparkles -->
    <path d="M 58 18 L 60 12 L 62 18 L 68 20 L 62 22 L 60 28 L 58 22 L 52 20 Z" fill="#F5C518" />
    <path d="M 104 50 L 105 45 L 106 50 L 111 51 L 106 52 L 105 57 L 104 52 L 99 51 Z" fill="#F5C518" />
  </g>
</svg>
