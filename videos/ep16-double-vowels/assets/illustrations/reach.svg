<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- REACH (reaching hand reaching for a star) sticker in Neo-brutalist style -->
  <g stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Motion lines -->
    <path d="M 22 92 L 14 98" fill="none" stroke-width="3" />
    <path d="M 32 102 L 24 108" fill="none" stroke-width="3" />
    
    <!-- Arm / Sleeve -->
    <path d="M 10 110 L 32 85 L 45 96 L 22 120 Z" fill="#4DABF7" />
    <line x1="32" y1="85" x2="45" y2="96" stroke="#2B2B2B" stroke-width="3.5" />
    
    <!-- Hand reaching forward/up -->
    <!-- Palm and fingers -->
    <path d="M 32 85 
             L 52 64 
             C 55 60, 60 62, 62 66 
             L 68 56 
             C 71 52, 77 54, 78 59 
             L 84 50 
             C 87 46, 93 49, 93 55 
             L 82 72 
             L 85 70 
             C 89 67, 94 72, 90 77 
             L 68 96 
             L 45 96 Z" fill="#FFE8CC" />
             
    <!-- Finger separation creases -->
    <path d="M 60 70 L 66 65" fill="none" stroke="#2B2B2B" stroke-width="2.5" />
    <path d="M 68 76 L 75 70" fill="none" stroke="#2B2B2B" stroke-width="2.5" />

    <!-- Big Target Star (being reached) -->
    <polygon points="98,16 102,28 114,29 105,38 108,50 98,43 88,50 91,38 82,29 94,28" fill="#F5C518" />
    
    <!-- Sparkle accents around the star -->
    <line x1="98" y1="8" x2="98" y2="12" stroke="#E8A93E" stroke-width="3" />
    <line x1="118" y1="24" x2="114" y2="26" stroke="#E8A93E" stroke-width="3" />
    <circle cx="82" cy="18" r="2.5" fill="#E8A93E" />
  </g>
</svg>
