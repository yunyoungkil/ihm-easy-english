<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["10-practice"] = tl;
  // Real narration (64.36s) vs. the 29.9s estimate this was authored against (this
  // scene's slow "다시 한 번, 좀 더 빠르게" repeats came out much slower than the
  // 6.5-chars/sec estimate assumed) — every scheduled position gets multiplied by
  // RATIO so the whole sequence stretches proportionally (tl.timeScale() didn't
  // work — see knowledge/now.md EP13 section).
  var RATIO = 64.36 / 29.9;
  var _to = tl.to.bind(tl), _fromTo = tl.fromTo.bind(tl), _set = tl.set.bind(tl), _call = tl.call.bind(tl);
  tl.to = function (t, v, p) { return _to(t, v, typeof p === "number" ? p * RATIO : p); };
  tl.fromTo = function (t, f, v, p) { return _fromTo(t, f, v, typeof p === "number" ? p * RATIO : p); };
  tl.set = function (t, v, p) { return _set(t, v, typeof p === "number" ? p * RATIO : p); };
  tl.call = function (fn, params, p) { return _call(fn, params, typeof p === "number" ? p * RATIO : p); };

  var chipRow = document.getElementById("f10-chip-row");
  var connectorFill = document.getElementById("f10-connector-fill");
  var c1 = document.getElementById("f10-c1"), c1l = document.getElementById("f10-c1-l"), c1s = document.getElementById("f10-c1-s");
  var c2 = document.getElementById("f10-c2"), c2l = document.getElementById("f10-c2-l"), c2s = document.getElementById("f10-c2-s");
  var c3 = document.getElementById("f10-c3"), c3l = document.getElementById("f10-c3-l"), c3s = document.getElementById("f10-c3-s");
  var result = document.getElementById("f10-result");
  var resultWord = document.getElementById("f10-result-word");
  var resultPron = document.getElementById("f10-result-pron");
  var progressFillEl = document.getElementById("f10-progress-fill");

  tl.fromTo(document.getElementById("f10-prompt"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.1);

  function round(t, letters, sounds, wordHtml, pron, exceptionFirst) {
    // Reset stage.
    tl.set([c1, c2, c3], { opacity: 0 }, t)
      .set(chipRow, { opacity: 1 }, t)
      .set(connectorFill, { width: "0%" }, t)
      .set(result, { opacity: 0, scale: 1 }, t)
      .set(c1, { className: "f10-chip" + (exceptionFirst ? " f10-chip--exc" : "") }, t);
    tl.call(function () {
      c1l.textContent = letters[0]; c1s.textContent = sounds[0];
      c2l.textContent = letters[1]; c2s.textContent = sounds[1];
      c3l.textContent = letters[2]; c3s.textContent = sounds[2];
      resultWord.innerHTML = wordHtml;
      resultPron.textContent = pron;
    }, null, t);

    // Chips appear left to right with the connector filling behind them.
    tl.fromTo(c1, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.4)" }, t + 0.1);
    tl.to(connectorFill, { width: "33%", duration: 0.25 }, t + 0.3);
    tl.fromTo(c2, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.4)" }, t + 1.0);
    tl.to(connectorFill, { width: "66%", duration: 0.25 }, t + 1.2);
    tl.fromTo(c3, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.28, ease: "back.out(1.4)" }, t + 1.9);
    tl.to(connectorFill, { width: "100%", duration: 0.25 }, t + 2.1);

    // Converge into the assembled result — "이어 붙이면, ○○!"
    tl.to(chipRow, { opacity: 0, scale: 0.94, duration: 0.35, ease: "power2.inOut" }, t + 2.9);
    tl.fromTo(result, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, t + 3.2);

    // "다시 한 번, 좀 더 빠르게" — 2x repeat pulse on the landed word.
    tl.to(resultWord, { scale: 1.1, duration: 0.14, ease: "power1.out" }, t + 4.2)
      .to(resultWord, { scale: 1, duration: 0.18, ease: "power1.in" }, t + 4.34);
    tl.to(resultWord, { scale: 1.1, duration: 0.14, ease: "power1.out" }, t + 4.7)
      .to(resultWord, { scale: 1, duration: 0.18, ease: "power1.in" }, t + 4.84);
  }

  // Scene 1 (0.0-7.0s VO, "브, 애, 그... 백! ...백, 백"): BAG.
  round(0.3, ["B", "A", "G"], ["브", "애", "그"], "BAG", "백", false);

  // Scene 2 (7.0-14.0s VO, "크, 애, 트... 캣! ...캣, 캣"): CAT.
  round(7.0, ["C", "A", "T"], ["크", "애", "트"], "CAT", "캣", false);

  // Scene 3 (14.0-21.0s VO, "흠, 애, 프... 맵! ...맵, 맵"): MAP.
  round(14.0, ["M", "A", "P"], ["흠", "애", "프"], "MAP", "맵", false);

  // Scene 4 (21.0-29.9s VO, "셀이에요... 스, 에, 을... 셀! ...셀, 셀"): CELL — exception color
  // (the C chip and the hero word's leading letter switch to red, matching Frame 7/8).
  round(21.0, ["C", "E", "LL"], ["스", "에", "을"], "<span class='exc-letter'>C</span>ELL", "셀", true);

  tl.fromTo(progressFillEl, { width: "75%" }, { width: "83.333%", duration: 1.0, ease: "power1.inOut" }, 0.3);
})();
</script>
