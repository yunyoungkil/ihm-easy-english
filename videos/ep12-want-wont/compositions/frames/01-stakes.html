<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["01-stakes"] = tl;

  var line1Words = ["미드나", "영화", "보다가", "“아이", "원트", "잇”이랑", "“아이", "워운트", "두", "잇”,", "이", "두", "개가", "똑같이", "들려서", "자막", "없이는", "포기하신", "적", "있으시죠?"];
  var line2Words = ["오늘", "그", "이유를", "보여드리겠습니다"];

  var line1El = document.getElementById("stakes-line1");
  var line2El = document.getElementById("stakes-line2");
  var glowEl = document.getElementById("stakes-glow");
  var textBlockEl = document.getElementById("stakes-textblock");
  var progressFillEl = document.getElementById("stakes-progress-fill");

  var WORD_BASE = 0.10;
  var WORD_SEC_PER_CHAR = 0.028;
  var ENTRANCE_DUR = 0.38;
  var Y_OFFSET = 18;

  function layWords(container, words, startAt, ease) {
    var cumulative = startAt;
    var spans = [];
    for (var i = 0; i < words.length; i++) {
      var span = document.createElement("span");
      span.className = "stakes-word";
      span.textContent = words[i];
      container.appendChild(span);
      if (i < words.length - 1) container.appendChild(document.createTextNode(" "));
      var dur = WORD_BASE + words[i].length * WORD_SEC_PER_CHAR;
      spans.push({ el: span, start: cumulative });
      cumulative += dur;
    }
    spans.forEach(function (w) {
      tl.fromTo(
        w.el,
        { opacity: 0, y: Y_OFFSET },
        { opacity: 1, y: 0, duration: ENTRANCE_DUR, ease: ease },
        w.start
      );
    });
    return cumulative;
  }

  tl.fromTo(
    document.getElementById("stakes-eyebrow"),
    { opacity: 0, y: 8 },
    { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
    0.05,
  );

  // Scene 1 (~0.3s–11.0s VO): the long empathy setup. The per-word reveal itself is
  // quick (content-aware stagger, ~3.8s to finish popping in); the line then simply
  // holds fully visible while the narrator keeps reading through it — real audio is
  // 13.2s total and this clause is by far the longer of the two (character-count
  // estimate: ~11.0s in). Refine against real word timestamps once transcribed.
  layWords(line1El, line1Words, 0.3, "power2.out");

  // Scene 2 (~11.0s VO, "오늘 그 이유를 보여드리겠습니다"): the promise, this frame's
  // dominant element, snaps in with a touch of overshoot right as narration reaches it.
  layWords(line2El, line2Words, 11.0, "back.out(1.5)");

  // Scene 3 (~11.9s -> 13.2s, brief hold — audio is almost out of runway here, so this
  // is short compared to EP11's): settled jitter, no exit tween (buffer tail only).
  tl.to(textBlockEl, { x: 2, y: -1, duration: 0.45, ease: "sine.inOut" }, 12.0)
    .to(textBlockEl, { x: -1, y: 1, duration: 0.45, ease: "sine.inOut" }, 12.45)
    .to(textBlockEl, { x: 0, y: 0, duration: 0.45, ease: "sine.inOut" }, 12.9);

  // Ambient center glow — single bounded breathe across the whole shot, no loop.
  tl.fromTo(glowEl, { opacity: 0.2 }, { opacity: 0.42, duration: 6.6, ease: "sine.inOut" }, 0).to(
    glowEl,
    { opacity: 0.3, duration: 6.6, ease: "sine.inOut" },
    6.6
  );

  // progress-rail: first of 10 segments fills as Scene 2 lands, then holds flat.
  tl.fromTo(
    progressFillEl,
    { width: "0%" },
    { width: (100 / 10).toFixed(3) + "%", duration: 1.1, ease: "power1.inOut" },
    11.0
  );
})();
</script>
