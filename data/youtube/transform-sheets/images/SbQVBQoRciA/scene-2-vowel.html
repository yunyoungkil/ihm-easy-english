<!doctype html><meta charset="utf-8"><!-- 장면 2(철자 한 글자만 흐리게)는 이미지 모델이 철자를 계속 틀려서(2026-11-12 3번 시도) HTML로 그렸다. 768x1376으로 캡처한다. --><style>html{zoom:2}
*{box-sizing:border-box;margin:0}
body{width:384px;height:688px;background:#F4EFE6;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:336px;background:#fff;border:5px solid #000;border-radius:22px;box-shadow:10px 10px 0 #000;padding:34px 12px 30px;text-align:center}
.word{font:900 56px/1 "Arial Black","Arial",sans-serif;letter-spacing:-1px;display:flex;justify-content:center;align-items:flex-end;gap:2px;color:#000}
.gone{position:relative;color:#bdbdbd}
.gone:after{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:7px;background:#e8202a;transform:rotate(-38deg);transform-origin:center}
.arrow{color:#e8202a;font:900 26px/1 sans-serif;margin-top:10px;padding-left:2px}
.ko{font:900 64px/1.1 "Malgun Gothic",sans-serif;margin-top:26px;color:#000}
.pill{display:inline-block;margin-top:30px;background:#F5C518;border:4px solid #000;border-radius:40px;box-shadow:5px 5px 0 #000;padding:9px 20px;font:900 21px/1 "Malgun Gothic",sans-serif;color:#000}
</style><div class="card"><div class="word"><span>choc</span><span class="gone">o</span><span>late</span></div><div class="ko">초클릿</div><div class="pill">가운데 모음이 사라져요</div></div>
