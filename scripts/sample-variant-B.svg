<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="chalkGlow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/></filter>
    <radialGradient id="chalkVignette" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="rgba(35, 75, 55, 0.4)"/><stop offset="100%" stop-color="rgba(10, 25, 18, 0.95)"/></radialGradient>
    <linearGradient id="woodBorder" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B4513"/><stop offset="50%" stop-color="#5C2E0B"/><stop offset="100%" stop-color="#3D1E07"/></linearGradient>
  </defs>

  <!-- Wooden Frame & Slate -->
  <rect width="1280" height="720" fill="url(#woodBorder)"/>
  <rect x="24" y="24" width="1232" height="672" rx="12" fill="#1b382b"/>
  <rect x="24" y="24" width="1232" height="672" rx="12" fill="url(#chalkVignette)"/>

  <!-- Chalk Dust Textures & Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="12,12">
    <line x1="40" y1="120" x2="1240" y2="120"/>
    <line x1="40" y1="620" x2="1240" y2="620"/>
    <line x1="600" y1="120" x2="600" y2="620"/>
  </g>

  <!-- Chalk Badge -->
  <g transform="translate(60, 50)" filter="url(#chalkGlow)">
    <rect width="280" height="46" rx="8" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
    <text x="140" y="31" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="20" font-weight="900" fill="#1b382b">📝 필수문장20개</text>
  </g>

  
  <!-- Longform Layout -->
  <g transform="translate(60, 140)" filter="url(#chalkGlow)">
    <text x="0" y="70" font-family="'Pretendard', 'Arial Black', sans-serif" font-size="62" font-weight="900" fill="#ffffff">보고 싶어요</text>
    <text x="0" y="160" font-family="'Pretendard', 'Arial Black', sans-serif" font-size="74" font-weight="900" fill="#fef08a">이 표현 맞을까?</text>
    <path d="M 0 190 Q 200 215 450 190" stroke="#facc15" stroke-width="6" fill="none" stroke-linecap="round"/>
    <text x="0" y="270" font-family="'Pretendard', sans-serif" font-size="32" font-weight="900" fill="#86efac">⚡ 하루 10분 초급 영어 마스터</text>
    <text x="0" y="470" font-family="'Pretendard', sans-serif" font-size="24" font-weight="800" fill="#94a3b8">@이해하면쉬운영어</text>
  </g>

  <!-- Right Chalk Note Cards -->
  <g transform="translate(640, 120)" filter="url(#chalkGlow)">
    <g transform="translate(0, 0)">
      <rect width="560" height="220" rx="16" fill="rgba(0,0,0,0.55)" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-dasharray="8,6"/>
      <text x="40" y="55" font-family="'Pretendard', sans-serif" font-size="24" font-weight="900" fill="#f87171">❌ 직역하면 어색한 표현</text>
      <text x="280" y="145" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#ffffff">~I want to see~</text>
      <line x1="60" y1="130" x2="500" y2="130" stroke="#dc2626" stroke-width="7"/>
    </g>
    <g transform="translate(0, 250)">
      <rect width="560" height="250" rx="16" fill="rgba(254, 240, 138, 0.15)" stroke="#facc15" stroke-width="5"/>
      <text x="40" y="55" font-family="'Pretendard', sans-serif" font-size="26" font-weight="900" fill="#facc15">⭕ 원어민이 쓰는 진짜감정</text>
      <text x="280" y="160" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#ffffff" stroke="#facc15" stroke-width="3" paint-order="stroke fill">I miss you</text>
    </g>
  </g>
  
</svg>