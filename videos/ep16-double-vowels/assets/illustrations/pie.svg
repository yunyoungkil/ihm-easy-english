<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- PIE (Slice of cherry/apple pie) sticker in Neo-brutalist style -->
  <g stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pie Slice Body (Side crust + Filling) -->
    <!-- Filling (Cherry red) -->
    <path d="M 85 68 L 22 52 L 56 22 Z" fill="#C92A2A" />
    
    <!-- Top Lattice Crust -->
    <polygon points="85,68 22,52 56,22" fill="#FFD43B" />
    
    <!-- Lattice Strips on top -->
    <line x1="38" y1="36" x2="68" y2="60" stroke="#D9480F" stroke-width="3.5" />
    <line x1="48" y1="28" x2="78" y2="52" stroke="#D9480F" stroke-width="3.5" />
    <line x1="42" y1="52" x2="65" y2="30" stroke="#D9480F" stroke-width="3.5" />
    <line x1="56" y1="62" x2="75" y2="40" stroke="#D9480F" stroke-width="3.5" />

    <!-- Back Fluted Crust Ridge -->
    <path d="M 85 68 
             C 87 64, 85 58, 82 54 
             C 85 50, 83 44, 78 40 
             C 81 36, 78 30, 72 26 
             C 74 22, 68 18, 62 18 
             C 60 18, 56 22, 56 22 Z" fill="#F59F00" />

    <!-- Front Bottom Edge / Plate shadow -->
    <path d="M 22 52 L 22 64 L 85 80 L 85 68 Z" fill="#E8590C" />
    <!-- Dripping cherry filling -->
    <path d="M 44 68 Q 46 75 48 69" fill="#A61E4D" stroke="#2B2B2B" stroke-width="2" />
    <path d="M 64 72 Q 66 79 68 73" fill="#A61E4D" stroke="#2B2B2B" stroke-width="2" />

    <!-- Cute sparkle -->
    <path d="M 22 28 L 24 22 L 26 28 L 32 30 L 26 32 L 24 38 L 22 32 L 16 30 Z" fill="#F5C518" />
  </g>
</svg>
