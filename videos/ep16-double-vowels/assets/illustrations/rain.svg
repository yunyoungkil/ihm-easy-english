<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Cute Cloud Body -->
  <path d="M 38 64 L 84 64 A 18 18 0 0 0 84 28 A 22 22 0 0 0 46 25 A 16 16 0 0 0 38 64 Z" fill="#E7F5FF" stroke="#2B2B2B" stroke-width="4" stroke-linejoin="round"/>

  <!-- Cute Face on Cloud -->
  <!-- Cheerful Eyes -->
  <path d="M 46 44 Q 50 38 54 44" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 66 44 Q 70 38 74 44" fill="none" stroke="#2B2B2B" stroke-width="3" stroke-linecap="round"/>
  <!-- Blushing Cheeks -->
  <circle cx="44" cy="48" r="3.5" fill="#74C0FC" opacity="0.8"/>
  <circle cx="76" cy="48" r="3.5" fill="#74C0FC" opacity="0.8"/>
  <!-- Tiny Smile -->
  <path d="M 57 48 Q 60 52 63 48" fill="none" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Teardrop Raindrops -->
  <!-- Raindrop 1 (Left) -->
  <g transform="translate(32, 75)">
    <path d="M 6 0 C 6 0 0 8 0 12 A 6 6 0 0 0 12 12 C 12 8 6 0 6 0 Z" fill="#74C0FC" stroke="#2B2B2B" stroke-width="2.5"/>
  </g>

  <!-- Raindrop 2 (Middle Left - Lower) -->
  <g transform="translate(50, 84)">
    <path d="M 6 0 C 6 0 0 8 0 12 A 6 6 0 0 0 12 12 C 12 8 6 0 6 0 Z" fill="#339AF0" stroke="#2B2B2B" stroke-width="2.5"/>
  </g>

  <!-- Raindrop 3 (Middle Right) -->
  <g transform="translate(68, 74)">
    <path d="M 6 0 C 6 0 0 8 0 12 A 6 6 0 0 0 12 12 C 12 8 6 0 6 0 Z" fill="#74C0FC" stroke="#2B2B2B" stroke-width="2.5"/>
  </g>

  <!-- Raindrop 4 (Right - Lower) -->
  <g transform="translate(84, 85)">
    <path d="M 5 0 C 5 0 0 6 0 10 A 5 5 0 0 0 10 10 C 10 6 5 0 5 0 Z" fill="#339AF0" stroke="#2B2B2B" stroke-width="2.5"/>
  </g>

  <!-- Water Ripple Accent at Bottom -->
  <ellipse cx="60" cy="108" rx="22" ry="3.5" fill="none" stroke="#339AF0" stroke-width="2.5" stroke-linecap="round"/>
</svg>
