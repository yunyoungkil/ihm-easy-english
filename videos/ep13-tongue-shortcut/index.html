           2026-09-07 항목 참고). -->

      <script>
        // Narration <audio> lives inside each scene's own sub-composition (not here), and each
        // sub-composition registers its own separate timeline — nothing at the root/main level
        // needs its own choreography. Register an empty one here so the framework requirement
        // (one paused timeline per composition) is still satisfied.
        window.__timelines = window.__timelines || {};
        window.__mainTl = window.__mainTl || gsap.timeline({ paused: true });
        window.__timelines["main"] = window.__mainTl;
