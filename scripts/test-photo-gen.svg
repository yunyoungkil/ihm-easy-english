<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Cinematic Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F0FF" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#FF0077" flood-opacity="0.8"/>
    </filter>
    
    <!-- Cinematic Background Gradients -->
    <radialGradient id="bgGrad" cx="30%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="15%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="85%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#FF0077" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FF0077" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF500"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>

    <!-- Required Clip Path for Hero Photo -->
    <clipPath id="personClip">
      <rect x="730" y="30" width="510" height="660" rx="32"/>
    </clipPath>
  </defs>

  <!-- 1. BACKGROUND -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#cyanGlow)"/>
  <rect width="1280" height="720" fill="url(#magentaGlow)"/>

  <!-- Subtle Studio Grid Accents -->
  <path d="M 0 160 L 700 160 M 0 530 L 700 530" stroke="#00F0FF" stroke-width="1" opacity="0.12"/>
  <circle cx="100" cy="100" r="280" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.05"/>

  <!-- 2. HIGH-CTR TYPOGRAPHY & BADGES (LEFT SIDE) -->
  <!-- Top Neon Pill Badges -->
  <g transform="translate(60, 50)">
    <!-- EP.07 Badge -->
    <rect x="0" y="0" width="110" height="42" rx="21" fill="#0F172A" stroke="#00F0FF" stroke-width="2.5"/>
    <text x="55" y="27" fill="#00F0FF" font-family="'Pretendard', 'Montserrat', sans-serif" font-weight="900" font-size="20" text-anchor="middle">EP.07</text>
    
    <!-- Warning Badge -->
    <rect x="125" y="0" width="195" height="42" rx="21" fill="#FF0077" filter="url(#glow-red)"/>
    <text x="222" y="27" fill="#FFFFFF" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="900" font-size="19" text-anchor="middle">🚨 99%가 틀림</text>
  </g>

  <!-- Visual Question Box -->
  <g transform="translate(60, 122)">
    <rect x="0" y="0" width="340" height="48" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <text x="18" y="31" fill="#FF0077" font-family="'Pretendard', sans-serif" font-weight="900" font-size="22">-sion</text>
    <text x="90" y="31" fill="#94A3B8" font-family="'Pretendard', sans-serif" font-weight="700" font-size="20">발음:</text>
    <text x="155" y="31" fill="#FF4D4D" font-family="'Pretendard', sans-serif" font-weight="900" font-size="22" text-decoration="line-through">‘션’</text>
    <text x="215" y="31" fill="#00F0FF" font-family="'Pretendard', sans-serif" font-weight="900" font-size="25">‘젼’?</text>
  </g>

  <!-- Massive Headline Text (Max Contrast & Impact) -->
  <g font-family="'Pretendard', 'Black Han Sans', 'Noto Sans KR', sans-serif" font-weight="900">
    <!-- Line 1 -->
    <text x="60" y="265" font-size="84" fill="url(#goldGrad)" stroke="#000000" stroke-width="14" paint-order="stroke fill" letter-spacing="-2">
      ‘션’이 아니다?!
    </text>
    <!-- Line 2 -->
    <text x="60" y="370" font-size="78" fill="#FFFFFF" stroke="#000000" stroke-width="14" paint-order="stroke fill" letter-spacing="-2">
      평생 속았던
    </text>
    <!-- Line 3 -->
    <text x="60" y="475" font-size="86" fill="#00F0FF" stroke="#000000" stroke-width="14" paint-order="stroke fill" letter-spacing="-2">
      발음의 비밀 💥
    </text>
  </g>

  <!-- Bottom Secret Rule Box -->
  <g transform="translate(60, 540)">
    <rect x="0" y="0" width="630" height="115" rx="22" fill="#0F172A" stroke="#00F0FF" stroke-width="3" filter="url(#shadow)"/>
    <rect x="0" y="0" width="630" height="115" rx="22" fill="none" stroke="#FF0077" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.7"/>
    <text x="28" y="46" fill="#FFE600" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="900" font-size="24">
      💡 비밀공식: 모음 뒤 -sion = <tspan fill="#00F0FF" font-size="29">[젼 / ʒən]</tspan> ⭕
    </text>
    <text x="28" y="85" fill="#94A3B8" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="700" font-size="20">
      ex) Vi<tspan fill="#FFFFFF">sion</tspan> (비젼), Deci<tspan fill="#FFFFFF">sion</tspan> (디시젼)
    </text>
  </g>

  <!-- 3. PHOTOREALISTIC HERO CARD (RIGHT SIDE) -->
  <g filter="url(#shadow)">
    <!-- Cyan Neon Outer Frame -->
    <rect x="726" y="26" width="518" height="668" rx="36" fill="none" stroke="#00F0FF" stroke-width="4"/>
    
    <!-- High-Res Photo Image -->
    <image href="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&amp;auto=format&amp;fit=crop&amp;q=80" x="730" y="30" width="510" height="660" preserveAspectRatio="xMidYMid slice" clip-path="url(#personClip)"/>
    
    <!-- Gradient Overlay at bottom of photo card -->
    <rect x="730" y="460" width="510" height="230" fill="#060911" fill-opacity="0.7" clip-path="url(#personClip)"/>
    
    <!-- Text Badge Overlay on Photo -->
    <g clip-path="url(#personClip)">
      <rect x="760" y="525" width="450" height="58" rx="14" fill="#FF0077" opacity="0.95" filter="url(#glow-red)"/>
      <text x="985" y="563" fill="#FFFFFF" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="900" font-size="26" text-anchor="middle">
        "Vision이 '비션'이라고?" ❌
      </text>
      <text x="985" y="635" fill="#00F0FF" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-weight="800" font-size="21" text-anchor="middle" letter-spacing="1">
        이해하면 쉬운영어 · 시즌1
      </text>
    </g>
  </g>
</svg>