<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- PAINT (Artist Palette and Brush) sticker in Neo-brutalist style -->
  <g stroke="#2B2B2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Palette Board -->
    <path d="M 22 75 
             C 12 62, 14 36, 32 24 
             C 52 10, 80 18, 88 36 
             C 94 50, 86 68, 72 74 
             C 62 78, 54 68, 44 70 
             C 34 72, 30 84, 22 75 Z" fill="#FFE8CC" />

    <!-- Thumb Hole -->
    <ellipse cx="32" cy="66" rx="5" ry="6" fill="#F4EFE6" />

    <!-- Paint Blobs -->
    <circle cx="36" cy="34" r="5" fill="#E03131" />
    <circle cx="54" cy="26" r="5" fill="#F5C518" />
    <circle cx="72" cy="34" r="5" fill="#1971C2" />
    <circle cx="78" cy="52" r="5" fill="#099268" />
    <circle cx="64" cy="65" r="4.5" fill="#6741D9" />

    <!-- Paint Brush lying across palette -->
    <!-- Handle -->
    <path d="M 85 85 L 56 56" fill="none" stroke="#2B2B2B" stroke-width="5" stroke-linecap="round" />
    <!-- Ferrule (metal band) -->
    <path d="M 56 56 L 50 50" fill="none" stroke="#CED4DA" stroke-width="6" stroke-linecap="butt" />
    <!-- Bristles & Tip -->
    <path d="M 50 50 C 44 44, 40 46, 36 42 C 42 38, 44 44, 50 50 Z" fill="#1971C2" />
  </g>
</svg>
