(function () {
  var tl = gsap.timeline({ paused: true });

  var questionEl = document.getElementById("f02-question");
  var heroEl = document.getElementById("f02-hero");
  var followEl = document.getElementById("f02-follow");
  var glowEl = document.getElementById("f02-glow");
  var progressFillEl = document.getElementById("f02-progress-fill");

  var WORD_BASE = 0.10, WORD_SEC_PER_CHAR = 0.028, ENTRANCE_DUR = 0.36, Y_OFFSET = 16;

  function layWords(container, words, startAt, ease) {
    var cumulative = startAt, spans = [];
    for (var i = 0; i < words.length; i++) {
      var span = document.createElement("span");
      span.className = "f02-word";
      span.textContent = words[i];
      container.appendChild(span);
      if (i < words.length - 1) container.appendChild(document.createTextNode(" "));
      var dur = WORD_BASE + words[i].length * WORD_SEC_PER_CHAR;
      spans.push({ el: span, start: cumulative });
      cumulative += dur;
    }
    spans.forEach(function (w) {
      tl.fromTo(w.el, { opacity: 0, y: Y_OFFSET }, { opacity: 1, y: 0, duration: ENTRANCE_DUR, ease: ease }, w.start);
    });
    return cumulative;
  }

  // Scene 1 (~0.3s VO): the question, quick per-word pop-in, then holds while narration
  // reads through it (real audio 15.48s; question clause is roughly the first ~9s of it).
  layWords(questionEl, questionWords, 0.3, "power2.out");

  // Scene 2 (~9.0s VO, "정답은 발음 기호가 아닙니다"): hard-cut reversal — question dims,
  // hero reversal line slams in with slight overshoot. This is the head-fake payload.
  var HARD_CUT = 9.0;
  tl.to(questionEl, { opacity: 0.35, duration: 0.4, ease: "power1.inOut" }, HARD_CUT);
  tl.fromTo(heroEl, { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1.0, duration: 0.42, ease: "back.out(1.6)" }, HARD_CUT + 0.05);
  tl.fromTo(glowEl, { opacity: 0.2 }, { opacity: 0.5, duration: 0.6, ease: "power2.out" }, HARD_CUT + 0.05);

  // Scene 3 (~11.4s VO, "입을 얼마나 크게 벌리느냐, 그 차이 하나예요"): supporting follow-up
  // line settles below, then everything holds to the end.

  tl.fromTo(glowEl, { opacity: 0.5 }, { opacity: 0.36, duration: 4.0, ease: "sine.inOut" }, HARD_CUT + 0.65);

  tl.fromTo(progressFillEl, { width: "10%" }, { width: "20%", duration: 1.0, ease: "power1.inOut" }, HARD_CUT + 0.05);
})();
