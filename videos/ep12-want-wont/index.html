      <!-- No word-level bottom caption bar (was here: caption-weight-shift on Frame 04-10,
           caption-highlight trial on Frame 01-03, both removed 2026-09-04). Gemini TTS
           (this project's narration engine, chosen over HeyGen for pronunciation) returns
           no native word timestamps, so word-level captions require a whisper.cpp
           re-transcription pass that's unreliable on this channel's core content shape
           (Korean narration with embedded English target words like "Want"/"Won't" —
           whisper regularly misreads these and interpolates their timing). In this project
           6 of 10 lines had already fallen back to character-count-proportional approximate
           timing. Standing rule: [decisions/2026-09-04-no-word-level-captions-with-gemini-tts.md].
           Each frame's own big focus-phrase text (in compositions/frames/*.html) stays —
           it's phrase-level, not word-level, so this failure mode doesn't apply to it. -->
      <script>
      (function () {
        // The removed caption scripts used to be what created and registered this
        // project's root "main" GSAP timeline (framework requirement — see CLAUDE.md
        // rule 3). Nothing else in this file does that now that captions are gone, so
        // it has to be created here even though it stays empty: each scene's own
        // sub-composition (data-composition-src) registers its own separate timeline.
        window.__timelines = window.__timelines || {};
        window.__mainTl = window.__mainTl || gsap.timeline({ paused: true });
        window.__timelines["main"] = window.__mainTl;
      })();
      </script>
