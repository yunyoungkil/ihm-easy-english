<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["10-practice"] = tl;

  var syl1 = document.getElementById("f10-syl-1");
  var syl2 = document.getElementById("f10-syl-2");
  var full = document.getElementById("f10-full");
  var card = document.querySelector(".f10-card");

  // Retimed 2026-09-16 against real whisper timestamps (assets/voice/10.words.json) — the old
  // uniform offsets (+0.3/+1.1/+1.9/+3.2s from a single "start") assumed each word's slow-build
  // + fast-repeat beats were evenly spaced ~1s apart, but the real narration spreads them over
  // ~12s per word ("BOAT," 8.78s ... 보,11.51s ... 트12.61s ... 보트!15.19s ... 보트,20.17s ...
  // 보트.21.08s). Each beat now gets its own real timestamp instead of a relative offset.
  var WORDS = [
    { syls: ["보", "트"], full: "보트", color: "#8A5A12", reset: 8.6, syl1: 11.5, syl2: 12.6, merge: 15.1, pulse1: 20.1, pulse2: 21.0 },
    { syls: ["미", "트"], full: "미트", color: "#8A5A12", reset: 22.9, syl1: 24.8, syl2: 25.6, merge: 27.9, pulse1: 33.1, pulse2: 34.0 },
    { syls: ["헤", "드"], full: "헤드", color: "#D64545", reset: 38.5, syl1: 40.4, syl2: 40.8, merge: 43.4, pulse1: 47.8, pulse2: 48.6 }
  ];

  WORDS.forEach(function (w) {
    tl.call(function () {
      syl1.textContent = w.syls[0];
      syl2.textContent = w.syls[1];
      full.textContent = w.full;
      full.style.color = w.color;
      syl1.style.opacity = 0.3;
      syl2.style.opacity = 0.3;
      full.style.opacity = 0;
    }, null, w.reset);

    // Slow build: syllables light up one at a time, then merge into the full word.
    tl.to(syl1, { opacity: 1, duration: 0.5 }, w.syl1);
    tl.to(syl2, { opacity: 1, duration: 0.5 }, w.syl2);
    tl.to(card, { scale: 1.05, duration: 0.3 }, w.merge);
    tl.to(card, { scale: 1, duration: 0.3 }, w.merge + 0.3);
    tl.to(full, { opacity: 1, duration: 0.3 }, w.merge);

    // Fast repeat: word pulses twice, quickly, on the two real repeated utterances.
    tl.to(full, { scale: 1.08, duration: 0.15 }, w.pulse1);
    tl.to(full, { scale: 1, duration: 0.15 }, w.pulse1 + 0.15);
    tl.to(full, { scale: 1.08, duration: 0.15 }, w.pulse2);
    tl.to(full, { scale: 1, duration: 0.15 }, w.pulse2 + 0.15);
  });
})();
</script>
