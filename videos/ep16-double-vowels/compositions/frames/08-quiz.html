<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["08-quiz"] = tl;

  var prompt = document.getElementById("f08-prompt");
  var card = document.getElementById("f08-card");
  var word = document.getElementById("f08-word");
  var pron = document.getElementById("f08-pron");
  var circle = document.getElementById("f08-circle-path");

  // Retimed 2026-09-16 against real whisper timestamps (assets/voice/08.words.json) — qAt
  // now matches when each "n번째 단어" prompt is actually said, and revealAt matches when the
  // answer is actually spoken (e.g. Q1 used to reveal "시트" at 5.5s, well before "'시트'입니다"
  // is said at 10.64s).
  var Q = [
    { spelling: "SEAT", pron: "시트", color: "#2B2B2B", promptText: "첫 번째 단어", qAt: 3.0, revealAt: 10.6 },
    { spelling: "GOAL", pron: "골", color: "#2B2B2B", promptText: "두 번째 단어", qAt: 12.4, revealAt: 16.9 },
    { spelling: "SWEAT", pron: "스웻", color: "#D64545", promptText: "세 번째 단어", qAt: 22.2, revealAt: 25.5 }
  ];

  Q.forEach(function (q, i) {
    tl.call(function () {
      prompt.textContent = q.promptText;
      word.textContent = q.spelling;
      word.style.color = "#2B2B2B";
      pron.textContent = "";
      pron.style.color = "#2B2B2B";
      card.style.borderColor = "#2B2B2B";
      circle.setAttribute("stroke-dashoffset", "100");
    }, null, q.qAt);
    tl.to([prompt, card], { opacity: 1, duration: 0.3 }, q.qAt);

    tl.call(function () {
      word.style.color = q.color;
      pron.textContent = q.pron;
      pron.style.color = q.color;
    }, null, q.revealAt);
    tl.to(pron, { opacity: 1, duration: 0.01 }, q.revealAt);
    tl.to(circle, { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power1.inOut" }, q.revealAt);

    if (i < Q.length - 1) {
      tl.to([prompt, card], { opacity: 0, duration: 0.25 }, q.revealAt + 1.6);
    }
  });
})();
</script>
