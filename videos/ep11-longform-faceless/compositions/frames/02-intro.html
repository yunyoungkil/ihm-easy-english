<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var TOTAL_DURATION = 9.195;

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  window.__timelines["02-intro"] = tl;

  var wordmark = document.getElementById('f02intro-wordmark');
  var glow = document.getElementById('f02intro-glow');

  // ── wordmark spring-pop entrance (power3, no overshoot), ambient glow bloom
  //    lands as ONE beat with the wordmark's settle, then holds with a subtle
  //    breathing glow through the full line — no season/episode pill (단편
  //    방침, 2026-09-04: 시즌2·EP1 표기 제거). ──
  var POP_START = 0.15;
  var POP_DUR = 0.6;
  tl.fromTo(wordmark, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: POP_DUR, ease: 'power3.out' }, POP_START);

  var BLOOM_START = POP_START;
  var BLOOM_DUR = 0.85;
  var GLOW_PEAK = 0.28;
  tl.fromTo(glow, { opacity: 0, scale: 0.85 }, { opacity: GLOW_PEAK, scale: 1, duration: BLOOM_DUR, ease: 'power2.out' }, BLOOM_START);

  // bounded idle breathe on the glow through the rest of the line
  var BREATHE_START = BLOOM_START + BLOOM_DUR;
  var BREATHE_DUR = TOTAL_DURATION - BREATHE_START;
  var phase = { p: 0 };
  tl.to(phase, {
    p: Math.PI * 2 * (BREATHE_DUR / 2.8),
    duration: BREATHE_DUR,
    ease: 'none',
    onUpdate: function () {
      var s = Math.sin(phase.p);
      glow.style.opacity = String(GLOW_PEAK + s * 0.03);
      glow.style.transform = 'scale(' + (1 + s * 0.015).toFixed(4) + ')';
    }
  }, BREATHE_START);
})();
</script>
