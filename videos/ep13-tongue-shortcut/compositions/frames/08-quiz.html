  tl.fromTo(question, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, R3 + 0.15);
  revealAnswer(32.82, "CUP", "컵", "정답: 크 (규칙)", "ok", false);
