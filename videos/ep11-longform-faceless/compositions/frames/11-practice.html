<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  const heroEn = document.getElementById("p11-hero-en");
  const heroKo = document.getElementById("p11-hero-ko");

  // discrete-text-sequence: sparse {t, text} states, reverse-searched every frame
  // so the swap is correct under arbitrary seeks (not just forward playback).
  const HERO_SEQUENCE = [
    { t: 0, en: "gonna", ko: "거너" },
    { t: 2.62, en: "I'm gonna", ko: "아임 거너" },
    { t: 4.12, en: "I'm gonna go", ko: "아임 거너 고" },
  ];
  function heroStateAt(t) {
    for (let i = HERO_SEQUENCE.length - 1; i >= 0; i--) {
      if (t >= HERO_SEQUENCE[i].t) return HERO_SEQUENCE[i];
    }
    return HERO_SEQUENCE[0];
  }
  const heroDriver = { t: 0 };
  tl.to(
    heroDriver,
    {
      t: 8.411,
      duration: 8.411,
      ease: "none",
      onUpdate: () => {
        const s = heroStateAt(heroDriver.t);
        if (heroEn.textContent !== s.en) heroEn.textContent = s.en;
        if (heroKo.textContent !== s.ko) heroKo.textContent = s.ko;
      },
    },
    0,
  );

  // Scene 1 (0.0-1.5s): opening guide line, per-word reveal.
  ["#p11-w1", "#p11-w2", "#p11-w3", "#p11-w4"].forEach((sel, i) => {
    tl.fromTo(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, i * 0.22);
  });

  // press-release-spring: linear compression -> back.out(1.6) spring recovery,
  // with a burst glow blooming behind the phrase at the release beat.
  // Swaps land at RELEASE_START (press squeezes the old word away, release
  // both recovers scale AND reveals the new word landing).
  function pressReleasePulse(startTime) {
    const PRESS_DUR = 0.12;
    const RELEASE_DUR = 0.45;
    const PRESS_SCALE = 0.94;
    const BOUNCE = 1.6;
    const releaseStart = startTime + PRESS_DUR;

    tl.to("#p11-hero", { scale: PRESS_SCALE, duration: PRESS_DUR, ease: "power1.in" }, startTime);
    tl.to("#p11-hero", { scale: 1, duration: RELEASE_DUR, ease: `back.out(${BOUNCE})` }, releaseStart);

    tl.fromTo(
      "#p11-burst",
      { scale: 0.8, opacity: 0 },
      { scale: 1.15, opacity: 0.55, duration: 0.35, ease: "power2.out" },
      releaseStart,
    );
    tl.to("#p11-burst", { scale: 1.35, opacity: 0, duration: 0.35, ease: "power2.in" }, releaseStart + 0.35);
  }

  // Scene 2 (1.5-2.5s): hard-cut arrival of "gonna"/"거너" (the clip's own
  // data-start is the cut), punctuated by the landing pulse.
  pressReleasePulse(1.5);
  // Scene 3 (2.5-4.0s): swap to "I'm gonna"/"아임 거너" at 2.62s (release beat).
  pressReleasePulse(2.5);
  // Scene 4 (4.0-6.0s): swap to "I'm gonna go"/"아임 거너 고" at 4.12s (release beat).
  pressReleasePulse(4.0);

  // Scene 5 (6.0-8.411s): closing line reveals, hero phrase freezes and only
  // idles with a bounded sine jitter (sine-wave-loop, low amplitude) - no more
  // press beats once the third repeat has landed.
  ["#p11-c1", "#p11-c2", "#p11-c3"].forEach((sel, i) => {
    tl.fromTo(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.0 + i * 0.22);
  });

  tl.to(
    "#p11-hero",
    { y: -3, scale: 1.012, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 2 },
    6.05,
  );

  window.__timelines["11-practice"] = tl;
