<template>

    src: url('https://fonts.gstatic.com/s/notosanskr/v39/PbyxFmXiEBPT4ITbgNA5Cgms3VYcOA-vvnIzzg01eLQ.ttf') format('truetype');
  }
  @font-face {

  }

  #root {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: #0A1526; color: #FFFFFF; font-family: 'Noto Sans KR', sans-serif;
  }
  #root * { box-sizing: border-box; }
  .clip { position: absolute; inset: 0; }

  .f08-bg { background: radial-gradient(circle at 50% 46%, #12203A 0%, #0A1526 62%); }
  .f08-progress-track { position: absolute; left: 0; top: 0; width: 1920px; height: 4px; background: rgba(245, 197, 24, 0.15); }
  .f08-progress-fill { position: absolute; left: 0; top: 0; width: 70%; height: 4px; background: #F5C518; }

  .f08-prompt { position: absolute; left: 0; top: 380px; width: 1920px; text-align: center; font-size: 42px; font-weight: 700; color: #A9B4C4; opacity: 0; }
  .f08-hero-wrap { position: absolute; left: 0; top: 470px; width: 1920px; text-align: center; }
  .f08-hero { display: inline-block; font-size: 72px; font-weight: 900; color: #F5C518; text-shadow: 0 0 30px rgba(245, 197, 24, 0.3); opacity: 0; }
  .f08-sub { position: absolute; left: 0; top: 640px; width: 1920px; text-align: center; font-size: 32px; font-weight: 700; color: #A9B4C4; opacity: 0; }
</style>

<div data-hf-id="hf-qfjz" id="root" data-composition-id="08-practice" data-start="0" data-duration="12.98" data-width="1920" data-height="1080">
  <div data-hf-id="hf-blhx" id="f08-bg-clip" class="clip f08-bg" data-start="0" data-duration="12.98" data-track-index="0"></div>
  <div data-hf-id="hf-quzk" class="f08-progress-track"><div data-hf-id="hf-i4ea" class="f08-progress-fill" id="f08-progress-fill"></div></div>

  <div data-hf-id="hf-a8sg" class="f08-prompt" id="f08-prompt">이제 직접 소리 내보세요</div>
  <div data-hf-id="hf-io1c" class="f08-hero-wrap"><div data-hf-id="hf-vj2u" class="f08-hero" id="f08-hero">원트</div></div>
  <div data-hf-id="hf-u9zb" class="f08-sub" id="f08-sub">세 번만 따라 하시면 입이 기억합니다</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["08-practice"] = tl;

  var prompt = document.getElementById("f08-prompt");
  var hero = document.getElementById("f08-hero");
  var sub = document.getElementById("f08-sub");
  var progressFillEl = document.getElementById("f08-progress-fill");

  // Scene 1 (0.0-2.0s VO, "이제 직접 소리 내보세요"): prompt lands.
  tl.fromTo(prompt, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);

  // Scene 2 (~2.0-9.5s VO, "원트. 아이 원트. 아이 원트 잇."): a 3-beat drill — the same word
  // block expands step by step (in-place token cycle), pulsing on each repeat rather than
  // three separate elements.
  function pulse(text, t) {
    tl.to(hero, { opacity: 0, scale: 0.9, duration: 0.12, ease: "power1.in" }, t)
      .call(function () { hero.textContent = text; }, null, t + 0.12)
      .fromTo(hero, { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.6)" }, t + 0.14);
  }
  tl.set(hero, { opacity: 0 }, 2.0);
  pulse("원트", 2.6);
  pulse("아이 원트", 5.2);
  pulse("아이 원트 잇", 7.8);

  // Scene 3 (~9.5s VO -> end, "세 번만 따라 하시면 입이 기억합니다"): closing line settles.
  tl.fromTo(sub, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 9.8);

  tl.fromTo(progressFillEl, { width: "70%" }, { width: "80%", duration: 1.0, ease: "power1.inOut" }, 2.6);
})();
</script>
