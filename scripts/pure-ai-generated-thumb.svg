<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0813"/>
      <stop offset="50%" stop-color="#1b1035"/>
      <stop offset="100%" stop-color="#2d0b3f"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ff4e50"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff200"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dynamic Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <circle cx="280" cy="360" r="320" fill="#ff0844" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1000" cy="200" r="250" fill="#00f2fe" opacity="0.15" filter="url(#glow)"/>

  <!-- Decorative Grid Pattern Line Art -->
  <path d="M 0,180 L 1280,180 M 0,540 L 1280,540" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Left Side Visual Element: Neon Heart & Speech Card -->
  <g transform="translate(70, 100)" filter="url(#shadow)">
    <rect width="430" height="520" rx="36" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    
    <!-- Heart Visual -->
    <path d="M 215 250 C 215 250 110 170 110 115 C 110 75 142 45 182 45 C 205 45 226 58 235 75 C 244 58 265 45 288 45 C 328 45 360 75 360 115 C 360 170 255 250 255 250 Z" transform="translate(-20, 20)" fill="url(#pinkGrad)" filter="url(#glow)"/>

    <!-- Key Phrase Display -->
    <text x="215" y="340" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="2">I MISS YOU</text>
    
    <!-- EP Badge Pill -->
    <rect x="107" y="390" width="216" height="50" rx="25" fill="url(#cyanGrad)"/>
    <text x="215" y="423" text-anchor="middle" fill="#000000" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" letter-spacing="1">EPISODE 02</text>
  </g>

  <!-- Right Side High CTR Text Content -->
  <g filter="url(#shadow)">
    <!-- Top Pill Tag -->
    <rect x="550" y="105" width="290" height="56" rx="16" fill="url(#pinkGrad)"/>
    <text x="695" y="142" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="26" letter-spacing="1">초급 영어 필수 문장</text>

    <!-- Main Dynamic Headlines -->
    <text x="550" y="245" fill="#ffffff" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="68" letter-spacing="-1">"보고 싶어요"</text>
    <text x="965" y="245" fill="#00f2fe" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="56">를</text>
    
    <text x="550" y="365" fill="url(#yellowGrad)" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="92" letter-spacing="-2" filter="url(#glow)">영어로 어떻게?</text>

    <!-- Sub Callout Card -->
    <rect x="550" y="430" width="660" height="170" rx="28" fill="#000000" fill-opacity="0.4" stroke="url(#cyanGrad)" stroke-width="3"/>
    
    <text x="590" y="495" fill="#ffffff" font-family="'Noto Sans KR', sans-serif" font-weight="900" font-size="36">입에서 바로 나오는 필수 표현 20개!</text>
    <text x="590" y="555" fill="#ff4e50" font-family="'Noto Sans KR', sans-serif" font-weight="700" font-size="28">하루 5분 ⚡ 왕초보 탈출 프로젝트</text>
  </g>

  <!-- Decorative Bottom Accent Line -->
  <line x1="550" y1="635" x2="1210" y2="635" stroke="url(#yellowGrad)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
</svg>