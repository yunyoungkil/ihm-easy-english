<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A0B2E"/>
      <stop offset="60%" stop-color="#0B0414"/>
      <stop offset="100%" stop-color="#030107"/>
    </radialGradient>
    
    <!-- Neon Lighting Flares -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FF0055" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="yellowGlow" cx="40%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Intense Neon Bloom & Drop Shadow -->
    <filter id="neonGlowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <style>
      .font-heavy { font-family: 'Montserrat', 'Pretendard', 'Noto Sans KR', sans-serif; font-weight: 900; }
      .font-bold { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; font-weight: 800; }
      .stroke-black { stroke: #000000; stroke-width: 16px; paint-order: stroke fill; stroke-linejoin: round; }
      .stroke-thin { stroke: #000000; stroke-width: 8px; paint-order: stroke fill; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Dark Cinematic Studio Canvas -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#cyanGlow)"/>
  <rect width="1280" height="720" fill="url(#magentaGlow)"/>
  <rect width="1280" height="720" fill="url(#yellowGlow)"/>

  <!-- Background Studio Spotlight Grid Lines -->
  <path d="M0 600 L1280 600 M0 660 L1280 660 M640 500 L0 720 M640 500 L1280 720 M640 500 L320 720 M640 500 L960 720" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Right Side: Expressive Shocked Character Silhouette with Rim Light -->
  <g transform="translate(780, 120)" filter="url(#shadow)">
    <!-- Cyan Rim Light Glow Outline -->
    <path d="M 180 100 C 130 100 90 140 90 190 C 90 230 115 265 150 278 C 110 310 70 380 60 480 L 340 480 C 330 380 290 310 250 278 C 285 265 310 230 310 190 C 310 140 270 100 220 100 Z" fill="#0D0714" stroke="#00F0FF" stroke-width="6" filter="url(#neonGlowPink)"/>
    <!-- Hands on Head / Shocked Pose Overlay -->
    <path d="M 70 260 C 50 220 70 150 120 160 C 140 164 145 185 130 195 C 110 210 90 230 90 270 Z" fill="#150B24" stroke="#FF0055" stroke-width="4"/>
    <path d="M 330 260 C 350 220 330 150 280 160 C 260 164 255 185 270 195 C 290 210 310 230 310 270 Z" fill="#150B24" stroke="#FF0055" stroke-width="4"/>
    <!-- Glowing Shock Eyes & Expression -->
    <ellipse cx="170" cy="180" rx="16" ry="22" fill="#FFFFFF"/>
    <ellipse cx="230" cy="180" rx="16" ry="22" fill="#FFFFFF"/>
    <circle cx="170" cy="185" r="6" fill="#000000"/>
    <circle cx="230" cy="185" r="6" fill="#000000"/>
    <ellipse cx="200" cy="225" rx="22" ry="30" fill="#FF0055" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Shock Marks / Sparks -->
    <path d="M 80 100 L 40 60 M 320 100 L 360 60 M 200 60 L 200 10" stroke="#FFD700" stroke-width="8" stroke-linecap="round" filter="url(#neonGlowPink)"/>
  </g>

  <!-- Floating High-Contrast Badges (Top Left) -->
  <g transform="translate(60, 50)" filter="url(#shadow)">
    <!-- Pill 1: EPISODE -->
    <rect x="0" y="0" width="110" height="46" rx="23" fill="#FF0055"/>
    <text x="55" y="31" fill="#FFFFFF" class="font-heavy" font-size="22" text-anchor="middle">EP.02</text>
    
    <!-- Pill 2: Warning Badge -->
    <rect x="125" y="0" width="280" height="46" rx="23" fill="#1F1535" stroke="#00F0FF" stroke-width="3"/>
    <text x="265" y="30" fill="#00F0FF" class="font-bold" font-size="20" text-anchor="middle">🚨 99%가 틀리는 표현</text>
  </g>

  <!-- Massive High-CTR Typography Group (Left Center) -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    
    <!-- Line 1: Target Misconception Statement -->
    <text x="0" y="80" fill="#FFFFFF" class="font-heavy stroke-black" font-size="82">"보고 싶어요"</text>
    
    <!-- Line 2: Giant Konglish Trap Strike Box -->
    <g transform="translate(0, 120)">
      <!-- Box Container -->
      <rect x="0" y="15" width="560" height="125" rx="20" fill="#11071F" stroke="#FF0055" stroke-width="5" filter="url(#neonGlowPink)"/>
      <text x="30" y="102" fill="#FF4D79" class="font-heavy stroke-black" font-size="88" letter-spacing="-2">I MISS YOU?</text>
      
      <!-- Big Red ❌ Stamp Overlay -->
      <g transform="translate(480, 20)">
        <circle cx="35" cy="55" r="48" fill="#FF0055" stroke="#FFFFFF" stroke-width="6"/>
        <path d="M 18 38 L 52 72 M 52 38 L 18 72" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Line 3: Shock Punchline (Yellow/Cyan Double Impact) -->
    <g transform="translate(0, 370)">
      <text x="0" y="0" fill="#FFD700" class="font-heavy stroke-black" font-size="96" letter-spacing="-3">절대 쓰지 마세요!</text>
    </g>
  </g>

  <!-- Floating Warning Pill (Center Bottom) -->
  <g transform="translate(60, 600)" filter="url(#shadow)">
    <rect x="0" y="0" width="540" height="64" rx="32" fill="#FFD700"/>
    <path d="M 30 32 L 50 15 L 45 32 L 60 32 L 35 50 L 40 33 Z" fill="#000000"/>
    <text x="285" y="43" fill="#000000" class="font-heavy" font-size="28" text-anchor="middle">원어민이 오해하는 진짜 이유 ⚡</text>
  </g>

  <!-- Additional Visual Accent: Floating Neon Graphic Elements -->
  <!-- Question Marks in Background -->
  <text x="710" y="250" fill="#00F0FF" opacity="0.3" class="font-heavy" font-size="120" transform="rotate(-15 710 250)" filter="url(#neonGlowPink)">?</text>
  <text x="1140" y="450" fill="#FF0055" opacity="0.4" class="font-heavy" font-size="140" transform="rotate(20 1140 450)" filter="url(#neonGlowPink)">!</text>

  <!-- Highlighting Frame Border (Cinematic Feel) -->
  <rect x="15" y="15" width="1250" height="690" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3"/>
</svg>